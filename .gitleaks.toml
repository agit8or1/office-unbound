title = "office-unbound gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "fake passwords/tokens in unit-test fixtures (in-process mocks and test databases, no real credentials)"
targetRules = ["generic-api-key"]
paths = ['''^ics/tests/.*\.py$''', '''^ics/frontend/src/.*\.test\.ts$''']

[[allowlists]]
description = "prose false positive in a status doc: 'Untested: ssh host keys, growpart/disk layout' (no credential; flagged by generic-api-key)"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''Untested: ssh host keys, growpart/disk layout''']
paths = ['''^docs/status/guest-bootstrap-results\.md$''']
condition = "AND"

[[allowlists]]
description = "public OpenPGP key fingerprints (40 hex) — published on purpose (repo signing key, upstream apt keys)"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''(?i)\b(key|[A-Z_]*KEY_FPR)=[0-9A-F]{40}\b''']

[[allowlists]]
description = "shell comment, not a credential"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''# \$1 label, \$2 token -> ''']
paths = ['''^blueprints/lab/tests/webmail_sso_keyrotation\.sh$''']
condition = "AND"

[[allowlists]]
description = "lists of public OpenPGP archive-key fingerprints (40 hex each, space separated) pinned in golden-image recipes"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''[A-Z_]*KEY_FPRS="[0-9A-F]{40}( [0-9A-F]{40})*"''']

[[allowlists]]
description = "SHA-256 fingerprint of a public agent key in boot-test evidence JSON (a hash of a public key, not a secret)"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''"agent_key_fingerprint_sha256": "[0-9a-f]{64}"''']

[[allowlists]]
description = "SHA-256 pin of a public release key quoted in a results doc (public key hash, not a secret)"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''key pin unchanged: `[0-9a-f]{64}`''']
paths = ['''^docs/status/oci-signing-results\.md$''']
condition = "AND"

[[allowlists]]
description = "PEM header/footer literals in the Office image entrypoint's proof-key format check (a case statement; no key material). Triaged 2026-11-25"
targetRules = ["private-key"]
regexTarget = "match"
regexes = ['''^-----BEGIN (RSA )?PRIVATE KEY-----"\) end="-----END (RSA )?PRIVATE KEY-----''']
paths = ['''^blueprints/build/collabora/oci/entrypoint\.sh$''']
condition = "AND"

[[allowlists]]
description = "fake JWT in the desktop redaction unit test (header {alg:RS256}, payload {sub:doctest}, signature 'signat'): proves Bearer/JWT values are redacted; no real token"
targetRules = ["jwt"]
regexTarget = "line"
regexes = ['''^\s*const JWT: &str = "eyJ''']
paths = ['''^desktop/crates/ou-core/src/redact\.rs$''']
condition = "AND"
