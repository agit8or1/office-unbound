{% extends "base.html" %}
{% block title %}{{ title }} · {{ brand.name }}{% endblock %}
{% block main %}
<section class="hero narrow" role="alert">
  <h1>{{ title }}</h1>
  <p class="lead">{{ text }}</p>
  <p>{% if retry %}<a class="btn primary" href="/login">Try again</a>{% else %}<a class="btn" href="{{ back or "/" }}">{{ "Back" if back else "Back to home" }}</a>{% endif %}</p>
</section>
{% endblock %}
