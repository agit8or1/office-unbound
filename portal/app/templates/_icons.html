{# Inline SVG icons (stroke = currentColor). Decorative: aria-hidden; the visible label carries the meaning. #}
{% macro icon(name) -%}
<svg class="ic" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == 'mail' %}<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6 8.5-6"/>
{%- elif name == 'calendar' %}<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M8 3v4M16 3v4M3.5 10h17"/><circle cx="8.5" cy="14.5" r=".6"/><circle cx="12" cy="14.5" r=".6"/><circle cx="15.5" cy="14.5" r=".6"/>
{%- elif name == 'contacts' %}<circle cx="12" cy="9" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/>
{%- elif name == 'files' %}<path d="M3.5 7.5A2.5 2.5 0 0 1 6 5h3.4l2 2.2H18a2.5 2.5 0 0 1 2.5 2.5V16.5A2.5 2.5 0 0 1 18 19H6a2.5 2.5 0 0 1-2.5-2.5z"/>
{%- elif name == 'document' %}<path d="M7 3.5h7l4 4V19a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 19V5A1.5 1.5 0 0 1 7.5 3.5"/><path d="M14 3.5V8h4M9 12.5h6M9 15.5h6"/>
{%- elif name == 'spreadsheet' %}<rect x="4" y="4" width="16" height="16" rx="2.5"/><path d="M4 9.5h16M4 14.5h16M10 4v16"/>
{%- elif name == 'presentation' %}<rect x="3.5" y="4.5" width="17" height="11" rx="2"/><path d="M12 15.5V20M8.5 20h7M8 11l2.6-2.6 2 2L16 7.8"/>
{%- elif name == 'devices' %}<rect x="3" y="5" width="13" height="9" rx="1.8"/><path d="M7 18h5M9.5 14v4"/><rect x="17.5" y="9" width="3.5" height="9" rx="1.2"/>
{%- elif name == 'account' %}<circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.5 18c1.2-2.2 3.2-3.2 5.5-3.2s4.3 1 5.5 3.2"/>
{%- elif name == 'shield' %}<path d="M12 3.5 5 6v5.5c0 4.3 2.8 7.4 7 9 4.2-1.6 7-4.7 7-9V6z"/><path d="m9 12 2.2 2.2L15.2 10"/>
{%- elif name == 'key' %}<circle cx="8" cy="14" r="3.5"/><path d="m10.5 11.5 8-8M15 7l2.5 2.5M17.5 4.5 20 7"/>
{%- elif name == 'download' %}<path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/>
{%- elif name == 'external' %}<path d="M14 4.5h5.5V10M19.5 4.5 11 13M17.5 14v4a1.5 1.5 0 0 1-1.5 1.5H6A1.5 1.5 0 0 1 4.5 18V8A1.5 1.5 0 0 1 6 6.5h4"/>
{%- elif name == 'file' %}<path d="M7 3.5h7l4 4V19a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 19V5A1.5 1.5 0 0 1 7.5 3.5"/><path d="M14 3.5V8h4"/>
{%- endif %}</svg>
{%- endmacro %}
