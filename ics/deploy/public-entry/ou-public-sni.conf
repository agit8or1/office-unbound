# Office Unbound: the public entry on this host (owner 2026-11-20: the router forwards 80/443 here; "route by subdomain ... maybe use a proxy").
# Port 443 is routed by the TLS server name WITHOUT decrypting: deployment names pass through to their gateway VM (which terminates TLS);
# anything else reaches the ICS console only from the LAN/VPN, every other connection is closed. Every hop carries the real client address
# (PROXY protocol) so the console's own allow-list keeps working. Managed by Office Unbound; see docs/status/host-changes.md 2026-11-20.
stream {
    log_format ou_sni '$remote_addr sni="$ssl_preread_server_name" lan=$ou_lan up=$ou_upstream';
    access_log /var/log/nginx/ou-public-sni.log ou_sni;
    map $ssl_preread_server_name $ou_public {
        hostnames;
        app.officeunbound.com           127.0.0.1:4451;   # -> gateway VM ou-test1 (192.168.22.220)
        auth.officeunbound.com          127.0.0.1:4451;
        cloud.officeunbound.com         127.0.0.1:4451;
        office.officeunbound.com        127.0.0.1:4451;
        mail.officeunbound.com          127.0.0.1:4452;   # -> mail VM ou-test1 (192.168.22.221)
        autodiscover.officeunbound.com  127.0.0.1:4452;
        default                         "";
    }
    geo $ou_lan {
        default          0;
        127.0.0.1/32     1;
        192.168.22.0/24  1;
        192.168.22.1/32  0;    # the router: if it rewrote forwarded internet traffic to its own address, that traffic stays "outside"
        10.0.0.0/8       1;
    }
    map "$ou_public|$ou_lan" $ou_upstream {
        "~^(?<hop>[^|]+)\|"  $hop;              # a deployment name: its gateway
        "|1"                 127.0.0.1:4443;    # LAN/VPN, any other name (or none): the ICS console
        default              127.0.0.1:4459;    # internet, unknown name: closed
    }
    server {
        listen 192.168.22.167:443;
        ssl_preread on;
        proxy_pass $ou_upstream;
        proxy_protocol on;
        proxy_connect_timeout 5s;
        proxy_timeout 3600s;
    }
    # second hop: strip the PROXY header and pass the untouched TLS stream to the VM
    server { listen 127.0.0.1:4451 proxy_protocol; proxy_pass 192.168.22.220:443; proxy_connect_timeout 5s; proxy_timeout 3600s; }
    server { listen 127.0.0.1:4452 proxy_protocol; proxy_pass 192.168.22.221:443; proxy_connect_timeout 5s; proxy_timeout 3600s; }
    server { listen 127.0.0.1:4459 proxy_protocol; return ""; }
}
