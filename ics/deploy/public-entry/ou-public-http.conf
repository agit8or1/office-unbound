# Office Unbound: port 80 on this host (see ou-public-sni.conf). Deployment names go to their gateway VM (HTTPS redirects, ACME HTTP-01);
# anything else is refused. The ICS console has no plain-HTTP service.
server {
    listen 192.168.22.167:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 192.168.22.167:80;
    server_name app.officeunbound.com auth.officeunbound.com cloud.officeunbound.com office.officeunbound.com mail.officeunbound.com autodiscover.officeunbound.com;
    location / {
        proxy_pass http://192.168.22.220:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_connect_timeout 5s;
    }
}
