# Office Unbound: guest-facing reverse proxy for the dedicated bootstrap callback listener (security review 5 L4 / review 7).
# Guests reach ONLY `POST /api/v1/guest-bootstrap/report` on the address below; the console (login page, API) is not served on it.
#   1. systemctl enable --now ics-callback.service        (python -m ics.serve_callback, 127.0.0.1:8089; same epoch/fence guard as the console)
#   2. set ICS_GUEST_CALLBACK_DEDICATED=true in /etc/office-unbound/ics.env and restart ics.service  (the console app stops serving the route)
#   3. install this file as /etc/nginx/conf.d/ics-callback.conf, replace the <...> values, `nginx -t && systemctl reload nginx`
#   4. ICS_GUEST_CALLBACK_URL=https://<guest-facing address>:8443 must name THIS listener; the certificate fingerprint the guests pin is the one served here.
# The proxy overwrites X-Forwarded-For with the real peer address (the limiter keys on it): never pass a client-supplied value on.
limit_req_zone $binary_remote_addr zone=ou_cb:2m rate=30r/m;      # (conf.d files are included in the http context)
server {
    listen <guest-facing-ip>:8443 ssl;
    server_name _;
    ssl_certificate     /etc/office-unbound/tls/callback.crt;
    ssl_certificate_key /etc/office-unbound/tls/callback.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 4k;                       # the app caps at 4 KiB too

    location = /api/v1/guest-bootstrap/report {
        limit_req zone=ou_cb burst=10 nodelay;
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8089;
        proxy_set_header X-Forwarded-For $remote_addr;      # NOT $proxy_add_x_forwarded_for
        proxy_set_header Host $host;
        proxy_read_timeout 20s;
    }
    location / { return 404; }
}
