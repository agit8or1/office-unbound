# Repo re-sign job (User=administrator; applied only if the unit is installed). It must keep setuid sudo (to reach the signer and the repo machine), so
# NoNewPrivileges can NOT be set; everything else that does not touch the checkout, the build state or sudo is closed.
[Service]
ProtectSystem=full
ProtectHome=read-only
PrivateTmp=true
ReadWritePaths=/var/lib/office-unbound/pkgbuild
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
ProtectClock=true
ProtectHostname=true
RestrictRealtime=true
LimitCORE=0
