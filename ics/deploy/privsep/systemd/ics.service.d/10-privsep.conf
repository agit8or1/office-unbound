# Office Unbound privilege separation: additions to the existing ics.service sandbox (which already has NoNewPrivileges, ProtectSystem=strict with NO
# ReadWritePaths, empty CapabilityBoundingSet, RestrictAddressFamilies, seccomp). The service writes nothing outside its private /tmp.
[Service]
LimitCORE=0
DevicePolicy=closed
KeyringMode=private
PrivateIPC=true
TasksMax=1024
UMask=0077
