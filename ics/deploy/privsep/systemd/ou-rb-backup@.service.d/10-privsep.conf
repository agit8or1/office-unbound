# Backup runbook helper (root; machinectl/systemd-run -M, restic, pg_dump as postgres via runuser). Tested in a scratch machine: EVERY seccomp- or
# capability-trimming option (ProtectClock, ProtectHostname, ProtectKernelLogs, RestrictRealtime, SystemCallArchitectures, RestrictAddressFamilies,
# and per the base unit ProtectKernelModules/Tunables, LockPersonality) makes `runuser: cannot set user id` fail together with the base unit's
# NoNewPrivileges, so none of them is set. Only options without that effect are added. A real sandbox for this helper needs a redesign (the
# pg_dump step as its own unit with User=postgres), which belongs to the backup tier owner.
[Service]
LimitCORE=0
KeyringMode=private
