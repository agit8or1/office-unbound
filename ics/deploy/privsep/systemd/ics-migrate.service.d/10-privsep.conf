# ics-migrate runs as root (it reads the DB-owner URL from a root-only file) but needs nothing else: no capabilities, no kernel interfaces, no new
# namespaces, only inet/unix sockets, only the python syscalls. The base unit already sets NoNewPrivileges, ProtectSystem=strict, empty capability set.
[Service]
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
ProtectClock=true
ProtectHostname=true
ProtectProc=invisible
ProcSubset=pid
LockPersonality=true
RestrictRealtime=true
RestrictSUIDSGID=true
RestrictNamespaces=true
MemoryDenyWriteExecute=true
RemoveIPC=true
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources
SystemCallArchitectures=native
ReadOnlyPaths=/opt/office-unbound /etc/office-unbound
UMask=0077
LimitCORE=0
KeyringMode=private
