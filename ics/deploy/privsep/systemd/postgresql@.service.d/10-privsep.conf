# PostgreSQL cluster unit (distribution): nothing the server does needs the home directories, /usr, /etc writes, kernel interfaces, or new privileges.
# (The ICS backup helper runs pg_dump via runuser from its OWN unit, not from this one.)
[Service]
NoNewPrivileges=true
PrivateTmp=true
ProtectHome=true
ProtectSystem=full
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
ProtectClock=true
ProtectHostname=true
RestrictRealtime=true
RestrictSUIDSGID=true
SystemCallArchitectures=native
LimitCORE=0
