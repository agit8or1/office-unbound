#!/usr/sbin/nft -f
# Office Unbound golden image: default-deny inbound. Only DHCP/ICMP and replies to our own outbound traffic. The first-boot unit replaces this file with the
# ICS-authenticated ruleset (agent port to the ICS sources + declared ports). Nothing listens before that and there is no SSH rule at all.
flush ruleset
table inet ou_guest {
  chain input {
    type filter hook input priority 0; policy drop;
    ct state established,related accept
    ct state invalid drop
    iif "lo" accept
    ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } accept
    meta l4proto ipv6-icmp accept
    udp sport 67 udp dport 68 accept
    udp sport 547 udp dport 546 accept
  }
  chain forward {
    type filter hook forward priority 0; policy drop;
  }
  chain output {
    type filter hook output priority 0; policy accept;
  }
}
