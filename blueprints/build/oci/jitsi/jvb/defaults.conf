# Office Unbound defaults for the videobridge: no third-party address discovery (Amazon metadata, Jitsi's public STUN relay), no statistics transport unless the operator adds one.
videobridge {
  stats { enabled = false }
  ice { udp { port = 10000 } }
}
ice4j {
  harvest {
    mapping {
      aws { enabled = false }
      stun { enabled = false, addresses = [] }
    }
  }
}
