pid /tmp/nginx/nginx.pid;
worker_processes 1;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  client_body_temp_path /tmp/nginx/body; proxy_temp_path /tmp/nginx/proxy; fastcgi_temp_path /tmp/nginx/fcgi; uwsgi_temp_path /tmp/nginx/uwsgi; scgi_temp_path /tmp/nginx/scgi;
  server_tokens off;
  server {
    listen 8080;
    root /usr/share/element-web;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /config.json { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ =404; }
  }
}
