# generated by the ICS (deploy/configure.py chat_runbooks); Matrix Authentication Service: people sign in only through the deployment's Keycloak
# (upstream OIDC provider), never with a local password; no registration, no email, no telemetry.
http:
  listeners:
    - name: web
      resources: [{name: discovery}, {name: human}, {name: oauth}, {name: compat}, {name: graphql}, {name: assets}, {name: health}]
      binds: [{address: '127.0.0.1:8080'}]
  trusted_proxies: ['127.0.0.1/32']
  public_base: "https://@MAS_HOST@/"
  issuer: "https://@MAS_HOST@/"
database:
  uri: "postgresql://mas:@DB_PASSWORD@@127.0.0.1/mas"
  max_connections: 6
  min_connections: 0
matrix:
  kind: synapse
  homeserver: "@SERVER_NAME@"
  secret: "@MAS_SECRET@"
  endpoint: "http://127.0.0.1:8008/"
secrets:
  encryption: "@ENCRYPTION@"
  keys:
    - kid: "@KID@"
      key: |
@SIGNING_KEY@
passwords:
  enabled: false
account:
  password_registration_enabled: false
  password_change_allowed: false
  password_recovery_enabled: false
  email_change_allowed: false
  displayname_change_allowed: false
  account_deactivation_allowed: false
email:
  from: '"Office Unbound" <noreply@@DOMAIN@>'
  reply_to: '"Office Unbound" <noreply@@DOMAIN@>'
  transport: blackhole
upstream_oauth2:
  providers:
    - id: "@PROVIDER_ID@"
      human_name: "Office Unbound"
      issuer: "https://@AUTH_HOST@/realms/@REALM@"
      client_id: "@CLIENT_ID@"
      client_secret: "@CLIENT_SECRET@"
      token_endpoint_auth_method: client_secret_basic
      scope: "openid profile email"
      pkce_method: always
      on_backchannel_logout: logout_all
      claims_imports:
        localpart:
          action: require
          template: "{{ user.preferred_username }}"
        displayname:
          action: force
          template: "{{ user.name }}"
        email:
          action: force
          template: "{{ user.email }}"
          set_email_verification: always
