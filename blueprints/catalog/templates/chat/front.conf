# generated by the ICS (deploy/configure.py chat_runbooks): the chat VM's local web front (Element Web image), reached only from this VM's TLS
# proxy on 127.0.0.1:8070. It serves Element on the chat name and routes the Matrix and MAS names to Synapse and MAS on loopback.
pid /tmp/nginx/nginx.pid;
worker_processes 1;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  client_body_temp_path /tmp/nginx/body; proxy_temp_path /tmp/nginx/proxy; fastcgi_temp_path /tmp/nginx/fcgi; uwsgi_temp_path /tmp/nginx/uwsgi; scgi_temp_path /tmp/nginx/scgi;
  server_tokens off;
  map $http_upgrade $conn_upgrade { default upgrade; '' close; }
  # Element Web
  server {
    listen 127.0.0.1:8070 default_server;
    server_name @CHAT_HOST@;
    root /usr/share/element-web;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location = /healthz { add_header Content-Type text/plain; return 200 "ok\n"; }
    location = /config.json { alias /etc/ou-element/config.json; add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ =404; }
  }
  # Matrix client API: login/logout/refresh are MAS's compatibility layer, everything else Synapse
  server {
    listen 127.0.0.1:8070;
    server_name @MATRIX_HOST@;
    client_max_body_size 50m;
    location ~ ^/_matrix/client/(r0|v3|unstable)/(login|logout|refresh) {
      proxy_pass http://127.0.0.1:8080; proxy_set_header Host @MAS_HOST@;
      proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https;
    }
    location ~ ^/(_matrix|_synapse/client) {
      proxy_pass http://127.0.0.1:8008; proxy_set_header Host $host; proxy_http_version 1.1;
      proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https;
    }
    location = /.well-known/matrix/client {
      default_type application/json; add_header Access-Control-Allow-Origin * always;
      return 200 '{"m.homeserver":{"base_url":"https://@MATRIX_HOST@"},"org.matrix.msc2965.authentication":{"issuer":"https://@MAS_HOST@/","account":"https://@MAS_HOST@/account/"}}';
    }
    location / { return 404; }
  }
  # MAS (sign-in pages, OAuth, upstream callback and back-channel logout); its admin API is never reachable from outside
  server {
    listen 127.0.0.1:8070;
    server_name @MAS_HOST@;
    location /api/admin/ { return 403; }
    location / {
      proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $conn_upgrade;
      proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https;
    }
  }
}
