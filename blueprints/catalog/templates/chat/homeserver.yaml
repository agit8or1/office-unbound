# generated by the ICS (deploy/configure.py chat_runbooks); Synapse homeserver of the deployment. Sign-in is delegated to MAS (no local passwords),
# federation is off (no federation listener, empty whitelist), no telemetry (the image refuses to start without report_stats: false).
server_name: "@SERVER_NAME@"
public_baseurl: "https://@MATRIX_HOST@/"
report_stats: false
listeners:
  - port: 8008
    bind_addresses: ['127.0.0.1']
    type: http
    x_forwarded: true
    resources:
      - names: [client]
database:
  name: psycopg2
  # the node's PostgreSQL cluster uses the C.UTF-8 locale; Synapse wants C collation and only warns about ordering otherwise
  allow_unsafe_locale: true
  args:
    user: synapse
    password: "@DB_PASSWORD@"
    dbname: synapse
    host: 127.0.0.1
    cp_min: 2
    cp_max: 6
signing_key_path: /etc/ou-chat/signing.key
macaroon_secret_key: "@MACAROON@"
form_secret: "@FORM_SECRET@"
media_store_path: /data/media
max_upload_size: 50M
enable_registration: false
password_config:
  enabled: false
suppress_key_server_warning: true
trusted_key_servers: []
federation_domain_whitelist: []
allow_public_rooms_over_federation: false
allow_public_rooms_without_auth: false
require_auth_for_profile_requests: true
limit_profile_requests_to_users_who_share_rooms: true
include_profile_data_on_invite: false
enable_authenticated_media: true
url_preview_enabled: false
caches:
  global_factor: 0.5
matrix_authentication_service:
  enabled: true
  endpoint: http://127.0.0.1:8080/
  secret: "@MAS_SECRET@"
