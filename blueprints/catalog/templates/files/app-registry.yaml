# generated by the ICS (configure.files_runbooks); OpenCloud reads $OC_CONFIG_DIR/app-registry.yaml at start.
# Office Unbound: new documents are Microsoft Office formats (owner 2026-11-25: "should save documents as o365 default extensions, as well as
# work with them"). The list REPLACES OpenCloud 9.1.0's built-in one (services/app-registry/pkg/config/defaults: Sanitize uses the defaults
# only when no list is configured), so every upstream entry is kept; only allow_creation differs. OpenDocument files still open and save in
# their own format; the editor's Save As offers both families.
app_registry:
  mimetypes:
    - {mime_type: application/vnd.openxmlformats-officedocument.wordprocessingml.document, extension: docx, name: Word document, description: Microsoft Word document, allow_creation: true}
    - {mime_type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, extension: xlsx, name: Excel workbook, description: Microsoft Excel document, allow_creation: true}
    - {mime_type: application/vnd.openxmlformats-officedocument.presentationml.presentation, extension: pptx, name: PowerPoint presentation, description: Microsoft PowerPoint document, allow_creation: true}
    - {mime_type: application/pdf, extension: pdf, name: PDF, description: PDF document}
    - {mime_type: application/vnd.oasis.opendocument.text, extension: odt, name: OpenDocument text, description: OpenDocument text document}
    - {mime_type: application/vnd.oasis.opendocument.spreadsheet, extension: ods, name: OpenDocument spreadsheet, description: OpenDocument spreadsheet document}
    - {mime_type: application/vnd.oasis.opendocument.presentation, extension: odp, name: OpenDocument presentation, description: OpenDocument presentation document}
    - {mime_type: application/vnd.openxmlformats-officedocument.wordprocessingml.form, extension: docxf, name: Form Document, description: Form Document}
    - {mime_type: application/vnd.jupyter, extension: ipynb, name: Jupyter Notebook, description: Jupyter Notebook}
    - {mime_type: text/markdown, extension: md, name: Markdown file, description: Markdown file, allow_creation: true}
    - {mime_type: application/compressed-markdown, extension: zmd, name: Compressed markdown file, description: Compressed markdown file}
    - {mime_type: application/vnd.geogebra.slides, extension: ggs, name: GeoGebra Slides, description: GeoGebra Slides}
