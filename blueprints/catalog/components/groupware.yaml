name: groupware
version: 1.0.0
title: Groupware (gromox stack, package-based)
description: Mail/calendar/contacts (gromox + web + postfix + MariaDB), built by Office Unbound and installed from the OB apt repo (ADR-0003/0008).
artifacts:
  # Office Unbound packages from the DEV release channel (owner decision for the beta: dev signing key/channel), served by the ICS artifact service
  # (ADR-0015). Versions = what the package pipeline built and the dev channel holds (blueprints/build, /var/lib/office-unbound/pkgbuild/repo).
  # Ubuntu 24.04 (noble) builds (owner: every service VM runs noble): gromox/php-mapi 3.13-ou3+noble1 = recipe ou3 (patches 0001-0005) built with
  # `OU_TARGET=noble build.sh` (PHP 8.3 phpapi-20230831, libldap2, libtinyxml2-10), pool dev/gromox-noble; their OU library deps ou-libhx 4.28-ou1+noble1
  # and ou-wmime 1.2.0-ou1+noble1 sort above the Debian 12 builds and resolve unpinned. web/dav/sync (and ou-mapi-header-php) are Architecture: all with
  # distro-neutral php-* deps: the existing builds install unchanged on noble (verified 2026-11-18). The Debian 12 3.13-ou2 builds stay in the channel.
  - {name: gromox, kind: package, package: ou-gromox, version: "3.13-ou3+noble1", repo: ob-apt-dev}
  - {name: gromox-php-mapi, kind: package, package: ou-gromox-php-mapi, version: "3.13-ou3+noble1", repo: ob-apt-dev}
  - {name: groupware-web, kind: package, package: ou-grommunio-web, version: "5.2-ou2", repo: ob-apt-dev}
  - {name: groupware-dav, kind: package, package: ou-grommunio-dav, version: "1.9-ou1", repo: ob-apt-dev}
  - {name: groupware-sync, kind: package, package: ou-grommunio-sync, version: "2.7-ou1", repo: ob-apt-dev}
  - {name: mariadb, kind: package, package: mariadb-server, version: "10.11.13", repo: ubuntu-noble}
  - {name: postfix, kind: package, package: postfix, version: "3.8.6", repo: ubuntu-noble}
resources:
  cores:     {base: 2,    per_user: 0.01, source: "groupware-lab-results.md: 8 mailboxes, light load; 1 core per 100 users is a planning assumption (no load test yet)"}
  memory_mb: {base: 3072, per_user: 6,    source: "groupware-lab-results.md: idle stack ~1.3 GB incl page cache; gromox-imap 123 MB, mariadb 112 MB, gromox-http 85 MB, php-fpm ~35 MB/worker; 6 MB/user assumed"}
  disk_gb:   {base: 8,    per_user: 0,    source: "groupware-lab-results.md: machine image 3.5 GB + web 105 MB (sources deletable)"}
volumes:
  - {name: mailstore, path: /var/lib/gromox/user, size_gb: {base: 10, per_user: 2, source: "PLANNING ASSUMPTION: 2 GB default mailbox quota per user; lab measured only 26 MB for 8 mailboxes"}, backup: true}
  - {name: mariadb-data, path: /var/lib/mysql, size_gb: {base: 2, per_user: 0.01, source: "lab: MariaDB 128 MB for 8 users incl. schema"}, backup: true}
ports:
  - {name: smtp, port: 25, proto: tcp, exposure: public}
  - {name: submission, port: 587, proto: tcp, exposure: public}
  - {name: imaps, port: 993, proto: tcp, exposure: public}
  - {name: web-https, port: 8447, proto: tcp, exposure: edge}
depends_on: [identity]
dns:
  - {host: mail, type: A, target: vm}
  - {host: "@", type: MX, target: "10 mail"}
  - {host: autodiscover, type: CNAME, target: mail}
  - {host: "@", type: TXT, target: "v=spf1 mx -all"}
health_checks:
  - {name: smtp-banner, kind: smtp_banner, port: 25}
  - {name: imaps-tls, kind: tcp_tls, port: 993}
  - {name: web-tls, kind: tcp_tls, port: 8447}
backup:
  method: logical_export
  description: "gromox-exm2mt per mailbox (-s, IPM_SUBTREE) + mariadb dump; ACLs are NOT exported (documented gap)"
  quiesce: online
  rpo_hours: 24
  evidence: "docs/status/groupware-lab-results.md GW07 (in place); separate-machine drill still open"
upgrade: {downtime_seconds: 300}
sizing:
  services: [mail, calendar, contacts]
  minimum: {cores: 2, memory_mb: 2048, disk_gb: 8}
  recommended: {cores: 2, memory_mb: 4096, disk_gb: 12}
  cores:
    base: 1
    base_evidence: estimate
    source: "ESTIMATE: groupware-lab-results.md had light load only; no CPU measurement"
    factors:
      - {per: concurrent_user, value: 0.02, evidence: estimate, source: "ESTIMATE: 1 core per 50 concurrent IMAP/EWS/web sessions; no load test"}
  memory_mb:
    base: 1536
    base_evidence: measured
    source: "groupware-lab-results.md: idle stack ~1.3 GB incl page cache (gromox-imap 123 MB, mariadb 112 MB, gromox-http 85 MB, php-fpm ~35 MB/worker)"
    factors:
      - {per: total_user, value: 2, evidence: estimate, source: "ESTIMATE: per-mailbox caches"}
      - {per: concurrent_user, value: 10, evidence: estimate, source: "ESTIMATE: php-fpm/gromox-http worker memory per active session"}
  disk_gb: {base: 8, base_evidence: measured, source: "groupware-lab-results.md: machine image 3.5 GB + web 105 MB (sources deletable)"}
  volumes:
    - {volume: mailstore, base: 10, base_evidence: estimate, source: "ESTIMATE: lab measured 26 MB for 8 mailboxes", factors: [{per: mailbox_gb, value: 1.15, evidence: estimate, source: "operator mailbox quota + 15% ESTIMATED index/metadata overhead"}]}
    - {volume: mariadb-data, base: 2, base_evidence: measured, source: "groupware-lab-results.md: MariaDB 128 MB for 8 users incl. schema", factors: [{per: total_user, value: 0.01, evidence: estimate, source: "ESTIMATE: 10 MB/user"}]}
  consolidation: {group: groupware, isolation: none, reason: "stateful mail store; its own VM in balanced/isolated layouts"}
  ha:
    note: "No application HA: gromox has no multi-server/replication setup here (groupware-lab-results.md: multi-server not tested)."
    strategies:
      - {id: vm_restart_shared_storage, status: implemented, note: "Proxmox HA restart (shared storage); recovery, not HA"}
  limitations: ["No concurrency/load test exists; all user scaling is estimated.", "ACLs are not part of the logical export backup."]
  validated: {total_users: 8, reference: "groupware-lab-results.md (8 mailboxes, 7 IMAP logins; no load test)"}
