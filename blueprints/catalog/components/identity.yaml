name: identity
version: 1.0.0
title: Identity (OpenLDAP + Keycloak + PostgreSQL)
description: Directory of record (OpenLDAP), OIDC provider (Keycloak) and its database (PostgreSQL). ADR-0004.
artifacts:
  # exact apt versions (pkg.install_pinned refuses ranges and bare upstream versions), proven with the agent runbook in docs/status/artifacts-core-results.md
  - {name: openldap, kind: package, package: slapd, version: "2.6.10+dfsg-0ubuntu0.24.04.1", repo: ubuntu-noble}
  - {name: postgresql, kind: package, package: postgresql-16, version: "16.15-0ubuntu0.24.04.1", repo: ubuntu-noble}
  # client tools the configuration runbook (cfg.ldap_init, ou_agent/cfghelper.py) uses over ldapi:/// as root (same source package as slapd)
  - {name: ldap-utils, kind: package, package: ldap-utils, version: "2.6.10+dfsg-0ubuntu0.24.04.1", repo: ubuntu-noble}
  # Keycloak 26.8.2: upstream tarball (Maven Central sha256 + sha1 and GitHub release digest + sha1 agree; the release .asc is present but its key could not be
  # checked from an authorized source) wrapped, not rebuilt, in a non-root image (blueprints/build/oci/idfiles); signed with the DEV channel key of the hardened
  # signer (ou-oci-sign). The registry host stays the .invalid placeholder (the digest is registry-independent); the lab copy is 192.168.186.235:5000/ou/keycloak.
  # Staging/stable need critical_unwaived == 0: the base-OS findings recorded in docs/status/artifacts-core-evidence block promotion today.
  - name: keycloak
    kind: oci
    image: registry.ou.invalid/ou/keycloak
    digest: "sha256:a7e5003b478b41652446008c91518da42c6ec8371260b1932696ce7af3fbf684"
    version: "26.8.2"
    signed: true
    unit:
      type: container-hostnet          # reaches PostgreSQL and the edge on 127.0.0.1 (same VM)
      memory_mib: 1400
      env: {KC_DB: postgres, KC_DB_URL: "jdbc:postgresql://127.0.0.1:5432/keycloak", KC_DB_USERNAME: keycloak, KC_HOSTNAME: "https://auth.{domain}",
            KC_HTTP_ENABLED: "true", KC_HTTP_HOST: 127.0.0.1, KC_HTTP_PORT: "8080", KC_PROXY_HEADERS: xforwarded, KC_HEALTH_ENABLED: "true",
            KC_TRUSTSTORE_PATHS: /opt/ou-tls/ca.crt, KC_BOOTSTRAP_ADMIN_USERNAME: kcadmin}
      secrets: [{name: kc-db-password, env: KC_DB_PASSWORD}, {name: kc-admin-password, env: KC_BOOTSTRAP_ADMIN_PASSWORD}]
      volumes: [{name: data, path: /opt/keycloak/data}, {name: tls, path: /opt/ou-tls, read_only: true}]
resources:
  cores:     {base: 2,    per_user: 0.004, source: "lab ou-id1: Keycloak java 0.65-0.87 GB RSS; +1 core per 250 users is a planning assumption (docs/status/identity-files-lab-results.md)"}
  memory_mb: {base: 2048, per_user: 2,     source: "identity-files-lab-results.md: ou-id1 MemoryMax 2G, machine total 0.87 GB idle; 2 MB/user JVM cache growth is an unmeasured assumption"}
  disk_gb:   {base: 6,    per_user: 0,     source: "OS packages + Keycloak distribution (lab estimate)"}
volumes:
  - {name: ldap-data, path: /var/lib/ldap, size_gb: {base: 2, per_user: 0.002, source: "lab: 19 LDAP entries is negligible; 2 MB/user is generous"}, backup: true}
  - {name: pgdata, path: /var/lib/postgresql, size_gb: {base: 5, per_user: 0.005, source: "lab keycloak DB tiny; headroom for sessions/events (assumption)"}, backup: true}
ports:
  - {name: ldaps, port: 636, proto: tcp, exposure: internal}
  - {name: keycloak-http, port: 8080, proto: tcp, exposure: local}
  - {name: keycloak-management, port: 9000, proto: tcp, exposure: local}
  - {name: postgres, port: 5432, proto: tcp, exposure: local}
depends_on: []
notices: []
dns: []
health_checks:
  - {name: keycloak-ready, kind: http, port: 9000, path: /health/ready, expect_status: 200, body_contains: '"UP"'}
  - {name: keycloak-oidc, kind: http, port: 8080, path: /realms/master/.well-known/openid-configuration, expect_status: 200}
  - {name: ldaps-tls, kind: tcp_tls, port: 636}
backup:
  method: online_dump
  description: "slapcat -n0/-n1 + pg_dumpall --globals-only + pg_dump -Fc keycloak + config tar (CA private key excluded)"
  quiesce: online
  rpo_hours: 24
  evidence: "docs/status/restore-drill-results.md (ou-id1 drill, online, no downtime)"
upgrade: {downtime_seconds: 120}
sizing:   # sizing engine (docs/status/sizing-api.md); evidence: measured = lab figure cited in source, estimate = planning value (+ safety margin)
  services: []
  core: true
  minimum: {cores: 1, memory_mb: 2048, disk_gb: 6}
  recommended: {cores: 2, memory_mb: 3072, disk_gb: 10}
  cores:
    base: 1
    base_evidence: estimate
    source: "ESTIMATE: no CPU measurement (identity-files-lab-results.md recorded memory only)"
    factors:
      - {per: concurrent_user, value: 0.01, evidence: estimate, source: "ESTIMATE: 1 core per 100 concurrent logins/token refreshes; no load test"}
  memory_mb:
    base: 1024
    base_evidence: measured
    source: "identity-files-lab-results.md: ou-id1 machine total 0.87 GB idle (Keycloak java 0.65-0.87 GB RSS) under MemoryMax 2G, 5 test users"
    factors:
      - {per: total_user, value: 2, evidence: estimate, source: "ESTIMATE: JVM/LDAP cache growth per directory entry; not measured"}
      - {per: concurrent_user, value: 4, evidence: estimate, source: "ESTIMATE: Keycloak session memory per active session; not measured"}
  disk_gb: {base: 6, base_evidence: estimate, source: "ESTIMATE: OS packages + Keycloak distribution (lab estimate)"}
  volumes:
    - {volume: ldap-data, base: 2, base_evidence: estimate, source: "ESTIMATE: 19 lab entries were negligible", factors: [{per: total_user, value: 0.002, evidence: estimate, source: "ESTIMATE: 2 MB per entry, generous"}]}
    - {volume: pgdata, base: 5, base_evidence: estimate, source: "ESTIMATE: Keycloak DB tiny in lab", factors: [{per: total_user, value: 0.005, evidence: estimate, source: "ESTIMATE: sessions/events"}]}
  consolidation: {group: front, isolation: none, reason: "light; shares a VM with the edge proxy in the balanced layout (ADR-0006 lightweight layout)"}
  ha:
    note: "No application HA: OpenLDAP multi-provider and PostgreSQL streaming replication are not implemented or validated. A VM replica would be an independent, divergent directory."
    strategies:
      - {id: multi_primary, status: designed, note: "OpenLDAP mirror mode / multi-provider; not built"}
      - {id: primary_replica, status: designed, note: "PostgreSQL streaming replication for Keycloak; not built"}
      - {id: vm_restart_shared_storage, status: implemented, note: "Proxmox HA restart on another node (needs shared storage); recovery after downtime, not HA"}
  limitations: ["Every other component depends on identity: its VM is a single point of failure for logins."]
  validated: {total_users: 5, reference: "identity-files-lab-results.md (5 LDAP test users, functional tests only)"}
