name: edge
version: 1.0.0
title: Edge (reverse proxy + TLS)
description: Public HTTPS entry, TLS termination and routing to the backends of the deployment.
artifacts:
  - {name: nginx, kind: package, package: nginx, version: "1.24.0", repo: ubuntu-noble}
resources:
  cores:     {base: 1,   per_user: 0,    source: "lab: nginx fronted office/files with negligible load"}
  memory_mb: {base: 512, per_user: 0.25, source: "assumption (TLS + proxy buffers)"}
  disk_gb:   {base: 2,   per_user: 0,    source: "assumption"}
volumes:
  - {name: certs, path: /etc/ou/tls, size_gb: {base: 1, per_user: 0, source: "certificates and ACME state"}, backup: true}
ports:
  - {name: http, port: 80, proto: tcp, exposure: public}
  - {name: https, port: 443, proto: tcp, exposure: public}
depends_on: [identity]
after: [groupware, files, office, chat, meetings, telephony]      # order-only: routes are added for whichever of these are present
dns:
  - {host: auth, type: A, target: vm}
health_checks:
  - {name: edge-tls, kind: tcp_tls, port: 443}
backup:
  method: config_tar
  description: "tar of /etc/ou/tls and proxy config"
  quiesce: online
  rpo_hours: 24
  evidence: "planned: not drilled"
upgrade: {downtime_seconds: 15}
sizing:
  services: []
  core: true
  minimum: {cores: 1, memory_mb: 256, disk_gb: 2}
  recommended: {cores: 1, memory_mb: 512, disk_gb: 4}
  cores:
    base: 1
    base_evidence: estimate
    source: "ESTIMATE: lab nginx fronted office/files with negligible load (not measured)"
    factors:
      - {per: concurrent_user, value: 0.004, evidence: estimate, source: "ESTIMATE: TLS termination, 1 core per 250 concurrent users"}
  memory_mb:
    base: 256
    base_evidence: estimate
    source: "ESTIMATE: nginx + certificates"
    factors:
      - {per: concurrent_user, value: 0.5, evidence: estimate, source: "ESTIMATE: proxy buffers per active connection set"}
  disk_gb: {base: 2, base_evidence: estimate, source: "ESTIMATE"}
  volumes:
    - {volume: certs, base: 1, base_evidence: estimate, source: "certificates and ACME state", factors: []}
  consolidation: {group: front, isolation: none, reason: "binds tcp/443 and tcp/80: cannot share a VM with chat, meetings or telephony (port conflict)"}
  ha:
    note: "Stateless proxy, but no floating IP / DNS failover is implemented; a second edge would need clients to reach it."
    strategies:
      - {id: stateless_active_active, status: designed, note: "two proxies behind a VIP (keepalived) or DNS; not built"}
      - {id: vm_restart_shared_storage, status: implemented, note: "Proxmox HA restart (shared storage); recovery, not HA"}
  limitations: []
  validated: {reference: "identity-files-lab-results.md (functional only; no load measured)"}
