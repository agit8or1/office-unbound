name: office
version: 1.0.0
title: Office (Office Unbound Docs, OB-built, lab-signed image)
description: Browser document editing via WOPI, built by Office Unbound from pinned source (ADR-0008, blueprints/build/collabora).
artifacts:
  # LAB-SIGNED (2026-11-15), not production: built from source in ou-build1 (blueprints/build/collabora/oci), signed with the LAB sigstore key
  # (ECDSA P-256, cosign-format attachment, verified with a sigstoreSigned/matchRepository policy exactly like ics/agent/deploy/render_image_policy.py).
  # Signing public key SPKI-DER sha256 fingerprint: d5227d3d5300405ee4333bcea4e3e70c5447b0bb59d801099acfe1dfdf317de4 (lab key, builder only; NOT the production key).
  # The registry host is still the .invalid placeholder: the digest is registry-independent (copy with --preserve-digests + its signature attachment);
  # the lab copy lives at 127.0.0.1:5000/ou/office in ou-build1. Replace the host and re-sign with the production key before any production use.
  - {name: collabora, kind: oci, image: registry.ou.invalid/ou/office, digest: "sha256:da2488739aa20766d5479db806f9287edc98f561d70a2be8075a11f4213ae097", version: "26.04.6-ou1"}
resources:
  cores:     {base: 2,    per_user: 0.02, source: "identity-files-lab-results.md: document load + conversion bursts; 1 core per 50 users is an assumption (no concurrency test)"}
  memory_mb: {base: 2048, per_user: 15,   source: "identity-files-lab-results.md: ou-office1 0.29 GB idle, 1.7 GB peak at a handful of sessions, MemoryMax 3G; ~10% concurrency x ~150 MB/doc assumed"}
  disk_gb:   {base: 6,    per_user: 0,    source: "CODE packages + fonts (lab estimate)"}
volumes: []
ports:
  - {name: coolwsd, port: 9980, proto: tcp, exposure: edge}
depends_on: [files]
dns:
  - {host: office, type: A, target: edge}
health_checks:
  - {name: wopi-discovery, kind: http, port: 9980, path: /hosting/discovery, expect_status: 200}
backup:
  method: stateless
  description: "no persistent data; redeploy from catalog"
  quiesce: online
  rpo_hours: 0
  evidence: "stateless by design"
upgrade: {downtime_seconds: 60}
