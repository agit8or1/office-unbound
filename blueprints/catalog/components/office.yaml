name: office
version: 1.0.0
title: Office (Office Unbound Docs, OB-built, dev-signed image)
description: Browser document editing via WOPI, built by Office Unbound from pinned source (ADR-0008, blueprints/build/collabora).
artifacts:
  # Built from source in ou-build1 (blueprints/build/collabora/oci). DEV-SIGNED 2026-11-18 through the hardened signer ou-oci-sign (dev channel key,
  # SPKI sha256 cd28d8bcc53aa2568d28c259b0923bc87f5e1bbd21e09e1bcdf28280aae7ee10; runner scan attestation + SBOM), published to the ICS artifact
  # service (ADR-0015) whose host the signature names. The catalog keeps the .invalid placeholder host: OU_ARTIFACT_BASE replaces it at plan time.
  - name: collabora
    kind: oci
    image: registry.ou.invalid/ou/office
    digest: "sha256:2cbeafdcfd9eaab177f969fce4b66d4c55e15e490e0ade37c3c621e2990ee6ee"
    version: "26.04.6-ou3"
    unit:
      # host networking like every other unit (the files VM's nginx terminates TLS for office.<domain> and proxies to 127.0.0.1:9980; the guest
      # firewall drops every inbound port the engine did not open). A private podman network failed on the first real VM (e2e-fo5, podman 4.9.3:
      # "failed to mount runtime directory for rootless netns: no such file or directory"; cause not yet determined, docs/status/STATUS.md open item)
      # and would not see the VM's /etc/hosts, which the engine fills with the deployment's names (WOPI to cloud.<domain>).
      type: container-hostnet
      # SYS_CHROOT is given back after DropCapability=ALL (NoNewPrivileges stays): coolwsd chroots every document process into its jail, and with an
      # empty bounding set that chroot fails with EPERM even in its own user namespace. Real VM e2e-fo6: no document process started, coolwsd held
      # :9980 without answering (it serves HTTP only after the first one), discovery timed out; lab run with exactly this capability answered.
      capabilities: [SYS_CHROOT]
      memory_mib: 2048
      # trust.crt = the deployment CA + Let's Encrypt's roots: the WOPI host (cloud.<domain>) is reached through the gateway, which serves the
      # PUBLIC certificate once gateway.certificates.issue ran; with the deployment CA alone every document stayed blank (2026-11-21: the editor's
      # websocket closed because coolwsd could not fetch the file)
      env: {OU_WOPI_HOST: "https://{host:cloud}:443", OU_SERVER_NAME: "{host:office}", OU_CA_FILE: /opt/ou-tls/trust.crt}
      volumes: [{name: work, path: /opt/ou-docs/work}, {name: tls, path: /opt/ou-tls, read_only: true}]
resources:
  cores:     {base: 2,    per_user: 0.02, source: "identity-files-lab-results.md: document load + conversion bursts; 1 core per 50 users is an assumption (no concurrency test)"}
  memory_mb: {base: 2048, per_user: 15,   source: "identity-files-lab-results.md: ou-office1 0.29 GB idle, 1.7 GB peak at a handful of sessions, MemoryMax 3G; ~10% concurrency x ~150 MB/doc assumed"}
  disk_gb:   {base: 6,    per_user: 0,    source: "CODE packages + fonts (lab estimate)"}
volumes: []
ports:
  - {name: coolwsd, port: 9980, proto: tcp, exposure: local}
depends_on: [files]
dns:
  - {host: office, type: A, target: edge}
health_checks:
  - {name: wopi-discovery, kind: http, port: 9980, path: /hosting/discovery, expect_status: 200}
  # ou3: discovery only proves the web server answers. After a (re)start the document processes ("kits") can be missing for a while
  # ("getNewChild: No child available", docs/status/docs-reliability-results.md), so this check runs a REAL conversion through a kit on the node
  # (ou-docs-ready via the loopback socket ou-docs-health.socket, 503 + reason while not ready). The edge must route exactly this path to
  # [::1]:9981 (blueprints/build/collabora/deploy/nginx-ou-ready.conf); the check is cached 5 s node-side so polling cannot starve the kits.
  # kit-ready (/hosting/ou-ready through the node-side ou-docs-health socket) is NOT registered for the container deployment: that socket unit belongs to
  # the package install (blueprints/build/collabora/deploy) and the engine does not create it yet (docs/status/artifacts-core-results.md open item 6).
backup:
  method: stateless
  description: "no persistent data; redeploy from catalog"
  quiesce: online
  rpo_hours: 0
  evidence: "stateless by design"
upgrade: {downtime_seconds: 60}
sizing:
  services: [office]
  minimum: {cores: 2, memory_mb: 2048, disk_gb: 6}
  recommended: {cores: 2, memory_mb: 4096, disk_gb: 8}
  cores:
    base: 1
    base_evidence: estimate
    source: "ESTIMATE: no CPU measurement for document load/conversion bursts"
    factors:
      - {per: office_editor, value: 0.1, evidence: estimate, source: "ESTIMATE: 1 core per 10 concurrently open documents"}
  memory_mb:
    base: 320
    base_evidence: measured
    source: "identity-files-lab-results.md: ou-office1 0.29 GB idle"
    factors:
      - {per: office_editor, value: 85, evidence: measured, source: "docs-reliability-results.md: 30 concurrent documents peaked at 2.77 GB on a 3 GB machine (0.29 GB idle) = ~83 MB per open document"}
  disk_gb: {base: 6, base_evidence: estimate, source: "ESTIMATE: packages + fonts (lab estimate)"}
  volumes: []
  consolidation: {group: files, isolation: none, reason: "stateless document engine next to files (WOPI)"}
  ha:
    note: "Stateless; a second instance needs WOPI routing by document (not implemented). Replicas are independent engines."
    strategies:
      - {id: stateless_active_active, status: designed, note: "document-affine routing of WOPI sessions; not built"}
  limitations: ["Validated at 30 concurrent documents only (docs-reliability-results.md); production nodes should get >= 4 GB."]
  validated: {concurrent: 30, concurrent_metric: office_editor, reference: "docs-reliability-results.md (30 concurrent documents)"}
