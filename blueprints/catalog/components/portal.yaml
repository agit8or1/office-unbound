name: portal
version: 1.0.0
title: User portal (single sign-on start page)
description: >-
  What employees open first: one Keycloak sign-in, then mail, calendar, contacts, files and new documents, recent files, account and device
  set-up; organisation administrators get the admin area. Runs next to the tenant's identity (one portal per tenant), plain HTTP on loopback
  behind the edge (portal/, docs/status/portal-results.md).
alongside: identity          # placed on every VM that runs identity, so each tenant has its own portal and Keycloak client
artifacts:
  - {name: portal, kind: package, package: ou-portal, version: "0.5.4-ou1", repo: ob-apt-dev}
resources:
  cores:     {base: 0,   per_user: 0,    source: "portal-results.md: one uvicorn worker, ~45 MB RSS"}
  memory_mb: {base: 128, per_user: 0.1,  source: "portal-results.md: ~45 MB RSS; per-user session memory is an assumption"}
  disk_gb:   {base: 1,   per_user: 0,    source: "Python app + Ubuntu python3-* packages (assumption)"}
volumes: []
ports:
  - {name: portal-http, port: 8090, proto: tcp, exposure: local}
depends_on: [identity]
dns:
  - {host: portal, type: A, target: edge}
health_checks:
  - {name: portal-ready, kind: http, port: 8090, path: /healthz, expect_status: 200}
backup:
  method: stateless
  description: "no state: configuration is rebuilt by the deployment (sessions are in memory)"
  quiesce: online
  rpo_hours: 24
  evidence: "stateless"
config_scope: deployment   # reconfigured in place when a component is added to or removed from the deployment
upgrade: {downtime_seconds: 5}
sizing:
  services: [portal]
  core: true
  minimum: {cores: 0, memory_mb: 128, disk_gb: 1}
  recommended: {cores: 0, memory_mb: 256, disk_gb: 1}
  cores: {base: 0, base_evidence: estimate, source: "ESTIMATE: negligible next to Keycloak"}
  memory_mb: {base: 128, base_evidence: estimate, source: "ESTIMATE: portal-results.md ~45 MB RSS + headroom", factors: [{per: concurrent_user, value: 0.1, evidence: estimate, source: "ESTIMATE: server-side session tokens"}]}
  disk_gb: {base: 1, base_evidence: estimate, source: "ESTIMATE"}
  volumes: []
  consolidation: {group: identity, isolation: none, reason: "runs with the tenant's identity"}
  ha:
    note: "Stateless; sessions are in memory, so a restart signs users in again (Keycloak SSO makes that silent)."
    strategies:
      - {id: vm_restart_shared_storage, status: implemented, note: "Proxmox HA restart (shared storage); recovery, not HA"}
  limitations: ["Sessions live in memory: a restart or a second replica means a new (silent) sign-in."]
  validated: {reference: "portal-results.md (lab, 39/39 e2e)"}
