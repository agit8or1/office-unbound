name: meetings
version: 1.0.0
title: Video meetings (Jitsi Meet + Office Unbound token service)
description: Video meetings. Jitsi Meet (web, Prosody, Jicofo, videobridge) where only people with a signed-in token can open a room, issued by the Office Unbound token service after Keycloak sign-in.
artifacts:
  # Lab ran Jitsi stable debs (jitsi-meet 2.0.11248, web/prosody-tokens 1.0.9442, jicofo 1.0-1205, jvb 2.3-318); own builds not done -> unpinned OCI placeholders.
  - {name: jitsi-web, kind: oci, image: registry.ou.invalid/ou/jitsi-web, digest: "sha256:", version: "1.0.9442"}
  - {name: prosody, kind: oci, image: registry.ou.invalid/ou/jitsi-prosody, digest: "sha256:", version: "0.12.4"}
  - {name: jicofo, kind: oci, image: registry.ou.invalid/ou/jicofo, digest: "sha256:", version: "1.0.1205"}
  - {name: jvb, kind: oci, image: registry.ou.invalid/ou/jitsi-videobridge, digest: "sha256:", version: "2.3.318"}
  - {name: meet-token-service, kind: oci, image: registry.ou.invalid/ou/meet-token-service, digest: "sha256:69b20d09d661d29ad5482e9603dfe628d5ca176925513c5d312ba04513e1e283", version: "0.1.0-ou1", signed: false}
  - {name: nginx, kind: package, package: nginx, version: "1.24.0", repo: ubuntu-noble}
resources:
  cores:     {base: 2,    per_user: 0.01, source: "ASSUMPTION: JVB is CPU/bandwidth bound; lab ran 2 video participants only (collaboration-lab-results.md); 1 core per 100 users planning value"}
  memory_mb: {base: 2048, per_user: 2,    source: "collaboration-lab-results.md section 4: ou-meet1 peak 1.68 GiB under MemoryMax 2G (idle 0.94; JVB 472 MB, Jicofo 311 MB, token service 55 MB); per-user growth is an ASSUMPTION"}
  disk_gb:   {base: 8,    per_user: 0,    source: "ASSUMPTION: OS + images; Jitsi is stateless, recordings (Jibri) are not part of this component"}
volumes: []
ports:
  - {name: https, port: 443, proto: tcp, exposure: edge}
  - {name: jvb-media, port: 10000, proto: udp, exposure: public}
depends_on: [identity]
dns:
  - {host: meet, type: A, target: edge}
health_checks:
  - {name: jitsi-jwt, kind: jitsi_jwt, port: 443}
  - {name: meet-tls, kind: tcp_tls, port: 443}
backup:
  method: stateless
  description: "No data to back up: rooms are ephemeral, sessions are in memory. Config and the token secret are regenerated by the deployment (secret lives in the vault)."
  quiesce: online
  rpo_hours: 0
  evidence: "collaboration-lab-results.md section 5: token service keeps sessions in memory; Jitsi holds no persistent state"
upgrade: {downtime_seconds: 60}
notices:
  - "Media uses UDP 10000 directly to the videobridge; users behind networks that block UDP need a TURN relay, which is not packaged yet (open item)."
  - "Token service is a lab spike (in-memory sessions, shared HS256 secret); production hardening is open (RS256 key, persistent sessions, role check)."
ha_note: "A replica is a complete, independent Jitsi stack on another node (anti-affinity keeps them apart); videobridge scale-out behind one Prosody and shard routing are not implemented or validated."
os_images: [ubuntu-24.04]
