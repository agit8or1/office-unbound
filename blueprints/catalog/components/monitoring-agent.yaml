name: monitoring-agent
version: 1.0.0
title: Node agent (monitoring + runbooks)
description: ICS node agent installed on every VM by cloud-init; required for enrollment, runbooks and checks (ADR-0002, ics/agent).
placement: every_vm
artifacts:
  # the node agent package as built and released; dev channel (beta). 0.5.0-ou10 (ou1-ou3 predate cfg.firewall, verified HTTPS upstreams, unit commands and guest.probe; ou4 ran cfg.volume_files's copy container under a systemd scope it cannot get from a system unit; ou5 returned no unit log on a failed start; ou6 froze a read-only cgroup tree into the rootless pause process; ou7 pinned distribution packages exactly; ou8 had no way to give the document engine CAP_SYS_CHROOT; ou9 has no groupware configuration runbook; ou10 has no portal, webmail sign-in, default edge site or per-tenant CA files; ou11 has no public certificates (cfg.acme), upstream CA choice or sign-in landing redirect; ou12 requires 16 characters for a person's password; ou13 cannot list, lock or delete directory people) adds the cfg.* configuration runbooks and is what the golden image
  # ships: the pin must never be below the image's agent (apt refuses a downgrade without --allow-downgrades, and the runbook passes none).
  - {name: ou-agent, kind: package, package: ou-node-agent, version: "0.10.0-ou19", repo: ob-apt-dev}
resources:
  cores:     {base: 0,  per_user: 0, source: "negligible"}
  memory_mb: {base: 64, per_user: 0, source: "Python stdlib HTTPS server (ics/agent)"}
  disk_gb:   {base: 1,  per_user: 0, source: "assumption"}
volumes: []
ports:
  - {name: agent, port: 8443, proto: tcp, exposure: ics}
depends_on: []
dns: []
health_checks: []
backup:
  method: stateless
  description: "re-enrolled on restore"
  quiesce: online
  rpo_hours: 0
  evidence: "stateless"
upgrade: {downtime_seconds: 5}
sizing:
  services: []
  core: true
  minimum: {cores: 0, memory_mb: 64, disk_gb: 1}
  recommended: {cores: 0, memory_mb: 64, disk_gb: 1}
  cores: {base: 0, base_evidence: estimate, source: "negligible"}
  memory_mb: {base: 64, base_evidence: estimate, source: "ESTIMATE: Python stdlib HTTPS server (ics/agent)"}
  disk_gb: {base: 1, base_evidence: estimate, source: "ESTIMATE"}
  volumes: []
  safety_margin_pct: 0
  consolidation: {group: agent, isolation: none, reason: "installed on every VM by the guest bootstrap"}
  ha: {note: "per-VM agent; not applicable", strategies: []}
  limitations: []
  validated: {reference: "first-real-deployment.md (agent enrolled on a real VM)"}
