name: files
version: 1.0.0
title: Files (OpenCloud)
description: File sync and share (OpenCloud + collaboration service), OIDC against identity. ADR-0005.
artifacts:
  # same-VM TLS proxy (the proven topology: OpenCloud plain HTTP on 127.0.0.1:9200 behind nginx on this VM); the deployment's edge reaches it over HTTPS. FIRST: packages install before the configuration
  # (cfg.nginx_site) that the engine inserts ahead of the first unit
  - {name: nginx, kind: package, package: nginx, version: "1.24.0-2ubuntu7.19", repo: ubuntu-noble}
  # OpenCloud 9.1.0: upstream release binary (the .sha256 file next to it and the GitHub asset digest agree with our sha256; upstream publishes no signature)
  # wrapped, not rebuilt, in a non-root image (blueprints/build/oci/idfiles), signed with the DEV channel key of the hardened signer (ou-oci-sign).
  # Registry host: .invalid placeholder (digest is registry-independent); lab copy 192.168.186.235:5000/ou/opencloud.
  - name: opencloud
    kind: oci
    image: registry.ou.invalid/ou/opencloud
    digest: "sha256:8105eed9f97ab9a80fdaa47de4e8e414e592aa983a74f590d4effc00d5b8afce"
    version: "9.1.0"
    signed: true
    unit:
      type: container-hostnet
      memory_mib: 900
      env: {OC_CONFIG_DIR: /var/lib/opencloud-config, OC_BASE_DATA_PATH: /var/lib/opencloud}
      secrets: [{name: ldap-bind-password, env: OC_LDAP_BIND_PASSWORD}, {name: oc-admin-password, env: OU_INIT_ADMIN_PASSWORD}]
      volumes: [{name: data, path: /var/lib/opencloud}, {name: config, path: /var/lib/opencloud-config}, {name: tls, path: /opt/ou-tls, read_only: true}]
  # the collaboration (WOPI) service: the same image and configuration volume, entrypoint `collaboration server` (agent >= 0.5.0 unit command).
  # It reaches OpenCloud's registry on loopback and starts once OpenCloud is up (Restart=always); WOPI traffic reaches it through OpenCloud's proxy on :9200.
  - name: opencloud-collaboration
    kind: oci
    image: registry.ou.invalid/ou/opencloud
    digest: "sha256:8105eed9f97ab9a80fdaa47de4e8e414e592aa983a74f590d4effc00d5b8afce"
    version: "9.1.0"
    signed: true
    unit:
      type: container-hostnet
      memory_mib: 400
      command: [collaboration, server]
      env: {OC_CONFIG_DIR: /var/lib/opencloud-config, OC_BASE_DATA_PATH: /var/lib/opencloud}
      secrets: [{name: ldap-bind-password, env: OC_LDAP_BIND_PASSWORD}, {name: oc-admin-password, env: OU_INIT_ADMIN_PASSWORD}]
      volumes: [{name: data, path: /var/lib/opencloud}, {name: config, path: /var/lib/opencloud-config}, {name: tls, path: /opt/ou-tls, read_only: true}]
resources:
  cores:     {base: 1,    per_user: 0.004, source: "identity-files-lab-results.md: ou-files1 light; scale is a planning assumption"}
  memory_mb: {base: 1024, per_user: 1,     source: "identity-files-lab-results.md: ou-files1 0.23 GB idle, 0.57 GB peak, MemoryMax 2G"}
  disk_gb:   {base: 4,    per_user: 0,     source: "OS + container image (assumption)"}
volumes:
  - {name: files-data, path: /var/lib/opencloud, size_gb: {base: 10, per_user: 5, source: "PLANNING ASSUMPTION: 5 GB default per user; the lab data tree backup was ~17 MB"}, backup: true}
ports:
  - {name: opencloud, port: 9200, proto: tcp, exposure: local}
  - {name: collaboration, port: 9300, proto: tcp, exposure: local}
  - {name: https, port: 443, proto: tcp, exposure: edge, shared_with: [edge]}   # the same-VM TLS proxy (one nginx with the edge when co-located), reached by the edge VM only
depends_on: [identity]
notices: []
dns:
  - {host: cloud, type: A, target: edge}
health_checks:
  - {name: opencloud-status, kind: http, port: 9200, path: /status.php, expect_status: 200, body_contains: '"installed":true'}
backup:
  method: tar_xattr
  description: "tar with user.* xattrs + ACLs, numeric owners; brief stop of opencloud+collaboration; config dir included"
  quiesce: stop_service
  rpo_hours: 24
  evidence: "docs/status/restore-drill-results.md (ou-files1 drill: 143 xattr entries restored)"
upgrade: {downtime_seconds: 60}
sizing:
  services: [files]
  minimum: {cores: 1, memory_mb: 1024, disk_gb: 4}
  recommended: {cores: 2, memory_mb: 2048, disk_gb: 8}
  cores:
    base: 1
    base_evidence: estimate
    source: "ESTIMATE: identity-files-lab-results.md ou-files1 light load; not measured"
    factors:
      - {per: concurrent_user, value: 0.02, evidence: estimate, source: "ESTIMATE: 1 core per 50 concurrent sync clients"}
  memory_mb:
    base: 640
    base_evidence: measured
    source: "identity-files-lab-results.md: ou-files1 0.23 GB idle, 0.57 GB peak under MemoryMax 2G (5 test users)"
    factors:
      - {per: concurrent_user, value: 8, evidence: estimate, source: "ESTIMATE: per active sync/web session"}
  disk_gb: {base: 4, base_evidence: estimate, source: "ESTIMATE: OS + container image"}
  volumes:
    - {volume: files-data, base: 10, base_evidence: estimate, source: "ESTIMATE: lab data tree ~17 MB", factors: [{per: file_gb, value: 1.1, evidence: estimate, source: "operator file quota + 10% ESTIMATED versions/trash/metadata"}]}
  consolidation: {group: files, isolation: none, reason: "shares a VM with the document engine in the balanced layout (proven same-VM topology)"}
  ha:
    note: "No application HA: OpenCloud storage replication is not implemented or validated."
    strategies:
      - {id: vm_restart_shared_storage, status: implemented, note: "Proxmox HA restart (shared storage); recovery, not HA"}
  limitations: []
  validated: {total_users: 5, reference: "identity-files-lab-results.md (5 test users, functional sync/edit tests)"}
