name: chat
version: 1.0.0
title: Team chat (Matrix Synapse + MAS + Element Web)
description: Team messaging. Synapse homeserver, Matrix Authentication Service (sign-in only through Keycloak, no local passwords) and the Element Web client, with its own PostgreSQL.
config_revision: 2   # 2: concept alignment (Office Unbound home page, mark and font licence under /ou/ on the chat front, embedded_pages, oidc_metadata, theme fonts, Spaces.allRoomsInHome)
artifacts:
  # FIRST the packages: the chat VM's own PostgreSQL (databases synapse and mas, cfg.pg_db) and the same-VM TLS proxy (one nginx with files/edge when co-located)
  - {name: postgresql, kind: package, package: postgresql-16, version: "16.15-0ubuntu0.24.04.1", repo: ubuntu-noble}
  - {name: nginx, kind: package, package: nginx, version: "1.24.0-2ubuntu7.19", repo: ubuntu-noble}
  # OCI images built by Office Unbound (blueprints/build/collab, blueprints/build/oci), pinned by digest and signed through ou-oci-sign (dev channel key; docs/status/oci-signing-results.md).
  # Configuration comes from the ICS (deploy/configure.py chat_runbooks, templates/chat): homeserver.yaml + signing key, MAS config, the web front.
  - name: mas
    kind: oci
    image: registry.ou.invalid/ou/matrix-authentication-service
    digest: "sha256:0cc079599c9ccd68b28a058726a4fb555cafb2c92d6731ebca721c43d1c9a019"
    version: "1.29.0"
    unit:
      type: container-hostnet
      memory_mib: 256
      env: {MAS_CONFIG: /config/config.yaml, SSL_CERT_FILE: /config/trust.crt}
      volumes: [{name: masconfig, path: /config, read_only: true}]
  - name: synapse
    kind: oci
    image: registry.ou.invalid/ou/synapse
    digest: "sha256:542de3d410dc142cf45c69e42c13cbd970a497803dc7edb78c3e2b2ee5160a9d"
    version: "1.165.0"
    unit:
      type: container-hostnet
      memory_mib: 1024
      env: {SYNAPSE_CONFIG_PATH: /ou-chat/homeserver.yaml}
      volumes: [{name: config, path: /ou-chat, read_only: true}, {name: media, path: /data}]
  # Element Web; its nginx is the VM-local web front (127.0.0.1:8070) for the chat, matrix and mas names. The image's nginx writes under /tmp/nginx,
  # which exists only in the image (a read-only root would put an empty tmpfs on /tmp): this unit keeps a writable root, it holds no data.
  - name: element-web
    kind: oci
    image: registry.ou.invalid/ou/element-web
    digest: "sha256:13210cdafd616799bc3673a7ac7c6cb11ea58ae201c5f369c5d08c2eaecb01a3"   # 1.12.35-ou2: config under /ou-element (2026-11-24)
    version: "1.12.35-ou2"
    unit:
      type: container-hostnet
      memory_mib: 64
      read_only: false
      volumes: [{name: front, path: /ou-element, read_only: true}]
resources:
  cores:     {base: 2,    per_user: 0.004, source: "ASSUMPTION: lab (collaboration-lab-results.md section 4) had no load test; 1 core per 250 users planning value"}
  memory_mb: {base: 1536, per_user: 3,     source: "collaboration-lab-results.md section 4: ou-chat1 peak 1.27 GiB under MemoryMax 1.5G (idle 0.49 GiB; MAS 116 MB, Synapse 107 MB); 3 MB/user cache growth is an ASSUMPTION"}
  disk_gb:   {base: 8,    per_user: 0,     source: "ASSUMPTION: OS + Synapse/MAS images + Element tarball; not measured"}
volumes:
  - {name: pgdata, path: /var/lib/postgresql, size_gb: {base: 5, per_user: 0.02, source: "ASSUMPTION: lab DB was tiny; 20 MB/user for events/state"}, backup: true}
  # Synapse media and the configuration live in podman volumes on the root disk (ou-chat-media, ou-chat-config, ou-chat-masconfig, ou-chat-front);
  # a separate media disk and its backup are Planned (alpha: media backup not drilled)
ports:
  - {name: front, port: 8070, proto: tcp, exposure: local}
  - {name: synapse, port: 8008, proto: tcp, exposure: local}
  - {name: mas, port: 8080, proto: tcp, exposure: local}
  - {name: https, port: 443, proto: tcp, exposure: edge, shared_with: [edge, files, office, portal]}   # the same-VM TLS proxy (one nginx), reached by the edge VM only
  - {name: federation, port: 8448, proto: tcp, exposure: public, default_enabled: false}
depends_on: [identity]
dns:
  - {host: matrix, type: A, target: edge}
  - {host: chat, type: CNAME, target: matrix}
  - {host: mas, type: CNAME, target: matrix}
health_checks:
  - {name: matrix-versions, kind: http, port: 443, path: /_matrix/client/versions, expect_status: 200, body_contains: versions, tls: true}
  - {name: matrix-login-flows, kind: http, port: 443, path: /_matrix/client/v3/login, expect_status: 200, body_contains: m.login.sso, tls: true}
  - {name: chat-tls, kind: tcp_tls, port: 443}
backup:
  method: online_dump
  description: "pg_dump -Fc of the synapse and mas databases + media store + Synapse signing key + MAS config/secrets; the signing key and MAS secret are required to restore"
  quiesce: online
  rpo_hours: 24
  evidence: "planned: not drilled (collaboration-lab-results.md section 6: Postgres+media+signing key backup/restore not drilled)"
upgrade: {downtime_seconds: 120}
notices:
  - "Federation (port 8448) is OFF by default; enable it explicitly with enabled_ports chat:federation. No well-known/delegation design exists yet."
  - "End-to-end encryption key backup/recovery for users is not evaluated (new devices ask for verification or a recovery key)."
  - "Uses its own PostgreSQL (databases synapse and mas); it is not the identity database."
ha_note: "Synapse/MAS/PostgreSQL replication (workers, streaming replication) is not implemented or validated; a second replica is a separate, independent server."
os_images: [ubuntu-24.04]
sizing:
  services: [chat]
  minimum: {cores: 1, memory_mb: 1536, disk_gb: 8}
  recommended: {cores: 2, memory_mb: 2048, disk_gb: 10}
  cores:
    base: 1
    base_evidence: estimate
    source: "ESTIMATE: collaboration-lab-results.md section 4 had no load test"
    factors:
      - {per: concurrent_user, value: 0.01, evidence: estimate, source: "ESTIMATE: 1 core per 100 concurrent chat users"}
  memory_mb:
    base: 1024
    base_evidence: measured
    source: "collaboration-lab-results.md section 4: ou-chat1 idle 0.49 GiB, peak 1.27 GiB incl. install under MemoryMax 1.5G"
    factors:
      - {per: total_user, value: 3, evidence: estimate, source: "ESTIMATE: Synapse cache growth per user"}
      - {per: concurrent_user, value: 2, evidence: estimate, source: "ESTIMATE: sync connections"}
  disk_gb: {base: 8, base_evidence: estimate, source: "ESTIMATE: OS + Synapse/MAS images + Element tarball"}
  volumes:
    - {volume: pgdata, base: 5, base_evidence: estimate, source: "ESTIMATE", factors: [{per: total_user, value: 0.02, evidence: estimate, source: "ESTIMATE: 20 MB/user events/state"}]}
  consolidation: {group: files, isolation: none, reason: "behind the same-VM TLS proxy (127.0.0.1:8070), like files; shares a VM with files/documents"}
  ha:
    note: "No application HA: Synapse workers / PostgreSQL replication not implemented; a replica is an independent server."
    strategies:
      - {id: vm_restart_shared_storage, status: implemented, note: "Proxmox HA restart (shared storage); recovery, not HA"}
  limitations: ["Federation off by default; E2E key backup not evaluated."]
  validated: {total_users: 2, reference: "collaboration-lab-results.md (functional tests; no load test)"}
