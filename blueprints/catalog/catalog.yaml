catalog_version: 1.0.0
os_images:
  - id: ubuntu-24.04
    title: Ubuntu 24.04 LTS (noble) cloud image
    template: ou-tpl-ubuntu-2404          # approved Proxmox template name (ADR-0009 section 5)
