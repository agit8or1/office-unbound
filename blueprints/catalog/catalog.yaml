  memory_reserve_pct: 10                  # host memory kept back, never allocated
  storage_reserve_pct: 10                 # configurable safety margin on PHYSICAL free space
  thin_max_ratio_pct: 100                 # a plan may not push a thin pool above 100% provisioned/physical (policy; raise explicitly)
