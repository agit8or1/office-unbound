name: large
version: 1.0.0
title: Large (up to 1000 users)
description: Medium layout with two office (document engine) workers, spread across nodes when possible.
maturity: experimental
max_users: 1000
min_nodes: 1
ha: false
tenancy: single
vms:
  - {name: identity, components: [identity]}
  - {name: edge, components: [edge]}
  - {name: groupware, components: [groupware]}
  - {name: files, components: [files]}
  - {name: office, components: [office], replicas: 2}
  - {name: chat, components: [chat]}
  - {name: meet, components: [meetings]}
  - {name: pbx, components: [telephony]}
optional_components: [office, chat, meetings, telephony]
default_optional: [office, chat, meetings]
backup: {schedule: daily, retention_days: 30, snapshot_before_change: true, offsite: true}
sizing_preset: {deployment_type: production, architecture: isolated}  # mapping onto the sizing engine
