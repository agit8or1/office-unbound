name: medium
version: 1.0.0
title: Medium (up to 250 users, 5 VMs)
description: One VM per component group; edge separated from identity.
maturity: lab-validated
max_users: 250
min_nodes: 1
ha: false
tenancy: single
vms:
  - {name: identity, components: [identity]}
  - {name: edge, components: [edge]}
  - {name: groupware, components: [groupware]}
  - {name: files, components: [files]}
  - {name: office, components: [office]}
optional_components: [office]
default_optional: [office]
backup: {schedule: daily, retention_days: 30, snapshot_before_change: true, offsite: true}
