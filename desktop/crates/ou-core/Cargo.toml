[package]
name = "ou-core"
description = "Office Unbound Desktop: platform-neutral protocol and safety code (discovery, OIDC PKCE, secrets, accounts, IPC types)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.23.1"
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls-no-provider", "http2"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "macros", "rt", "sync"] }
url = "2.5.9"

axum = { version = "0.8.9", optional = true }
unicode-normalization = "0.1.26"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Security_Credentials", "Win32_Foundation"] }

[dev-dependencies]
ou-core = { path = ".", features = ["test-support"] }
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["full"] }
serde_json = "1.0.154"
base64 = "0.23.1"

[features]
# Enables http:// to loopback for mock servers. Only dev-dependencies turn it on; release builds never do.
test-support = ["dep:axum"]
