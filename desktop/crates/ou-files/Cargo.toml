[package]
name = "ou-files"
description = "Office Unbound Desktop: files (OpenCloud WebDAV/Graph/TUS client, data-safety guards, Windows path rules, sync engine and mapped-drive drivers)"
version = "0.1.0-alpha.1"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.85"

# Standalone until the lead adds "crates/ou-files" to desktop/Cargo.toml members (then delete this table and the local Cargo.lock).
[workspace]

[dependencies]
ou-core = { path = "../ou-core" }
base64 = "0.23.1"
percent-encoding = "2.3"
quick-xml = "0.39"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "process", "time", "macros", "rt", "sync"] }
unicode-normalization = "0.1.26"
url = "2.5.9"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
ou-core = { path = "../ou-core", features = ["test-support"] }
tokio = { version = "1.54.1", features = ["full"] }

[features]
test-support = ["ou-core/test-support"]
