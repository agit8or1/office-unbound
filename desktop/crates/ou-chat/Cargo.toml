[package]
name = "ou-chat"
description = "Office Unbound Desktop: Teams-like chat on Matrix (matrix-rust-sdk, MAS OAuth 2.0 sign-in, E2EE) and meeting launch"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ou-core = { path = "../ou-core" }
# No TLS feature on purpose: ou-chat hands matrix-sdk the verified client from ou-core::http (rustls + OS trust store, ring),
# so there is no second TLS stack (aws-lc-rs) and no way to turn verification off. bundled-sqlite: Windows has no system SQLite.
matrix-sdk = { version = "0.20.0", default-features = false, features = ["e2e-encryption", "automatic-room-key-forwarding", "bundled-sqlite"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "macros", "rt", "sync"] }
url = "2.5.9"
mime = "0.3.18"
base64 = "0.23.1"
zeroize = "1.9.2"

[dev-dependencies]
ou-core = { path = "../ou-core", features = ["test-support"] }
# Mock homeserver + MAS (wiremock) maintained with the SDK: tests run against the same request shapes matrix-sdk sends.
matrix-sdk = { version = "0.20.0", default-features = false, features = ["e2e-encryption", "bundled-sqlite", "testing"] }
matrix-sdk-test = "0.20.0"
wiremock = { version = "0.6.5", default-features = false }
tokio = { version = "1.54.1", features = ["full"] }
