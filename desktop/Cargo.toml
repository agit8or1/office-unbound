[workspace]
resolver = "2"
# Feature modules (ou-files, ou-chat, ...) join automatically under crates/; the GUI crate is added once it exists.
members = ["crates/*", "app/src-tauri"]
# The Tauri GUI crate builds for Windows only (WebView2); Linux CI/dev runs the platform-neutral crates.
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.96"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
