[package]
name = "office-unbound-desktop"
description = "Office Unbound Desktop (GUI)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "office-unbound"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Everything is Windows-only: on other systems main.rs is a stub (no GTK/WebKitGTK/D-Bus headers needed).
[target."cfg(windows)".dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
ou-agent = { version = "0.1.0-alpha.1", path = "../../crates/ou-agent" }
ou-core = { version = "0.1.0-alpha.1", path = "../../crates/ou-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
