name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: "1.7.12"
  # sha256 of actionlint_1.7.12_linux_amd64.tar.gz, taken from the release's checksums file
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

jobs:
  shell-and-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: bash -n on every blueprint (and deploy) shell script
        run: |
          set -euo pipefail
          n=0
          while IFS= read -r -d '' f; do
            bash -n "$f" || { echo "::error file=$f::bash syntax error"; exit 1; }
            n=$((n+1))
          done < <(find blueprints ics/deploy ics/agent -type f -name '*.sh' -print0)
          echo "checked $n shell scripts"
          test "$n" -gt 0

      - name: py_compile on lab tests, lab scripts and blueprint helpers
        run: |
          set -euo pipefail
          n=0
          while IFS= read -r -d '' f; do
            python -m py_compile "$f" || { echo "::error file=$f::python syntax error"; exit 1; }
            n=$((n+1))
          done < <(find blueprints ics/scripts -type f -name '*.py' -print0)
          echo "compiled $n python files"
          test "$n" -gt 0
          find . -name __pycache__ -type d -prune -exec rm -rf {} +

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: actionlint (pinned, checksum verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          mkdir al && tar -xzf actionlint.tar.gz -C al actionlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/al/actionlint" -color
