name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # weekly: new advisories appear without code changes

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, taken from the release's checksums file
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  PIP_AUDIT_VERSION: "2.9.0"

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # full history
          persist-credentials: false

      - name: Install gitleaks (pinned version, checksum verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          mkdir gl && tar -xzf gitleaks.tar.gz -C gl gitleaks
          echo "$RUNNER_TEMP/gl" >> "$GITHUB_PATH"

      - name: Scan the full git history
        run: gitleaks git --redact --no-banner --verbose --exit-code 1 .

  python-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: pip-audit on the hash-pinned lock file (fails on any known vulnerability)
        run: |
          python -m venv "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/pip" install "pip-audit==${PIP_AUDIT_VERSION}"
          "$RUNNER_TEMP/audit/bin/pip-audit" -r ics/requirements.lock --no-deps --disable-pip --strict

  npm-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ics/frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Report (all severities, production dependencies)
        run: npm audit --omit=dev || true
      - name: Fail on high or critical
        run: npm audit --omit=dev --audit-level=high

  licenses:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Python dependency licenses (allowlist; unknown or proprietary fails)
        run: |
          python -m venv "$RUNNER_TEMP/lic"
          "$RUNNER_TEMP/lic/bin/pip" install --require-hashes --no-deps -r ics/requirements.lock
          "$RUNNER_TEMP/lic/bin/python" .github/scripts/check_licenses.py python
      - name: npm dependency licenses (allowlist; unknown or proprietary fails)
        run: python .github/scripts/check_licenses.py npm ics/frontend/package-lock.json
