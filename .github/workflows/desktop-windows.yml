name: desktop-windows

# Office Unbound Desktop on real Windows (GitHub-hosted windows-latest): tests, per-user NSIS installer
# (+ MSI once the Tauri GUI crate exists), installer smoke test, SBOM, advisories and licences.
# Output is an UNSIGNED ALPHA workflow artifact, never a release. No secrets, no signing.

on:
  push:
    branches: ["desktop-*"]
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.100.0"
  CARGO_AUDIT_VERSION: "0.22.2"
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_CYCLONEDX_VERSION: "0.5.10"
  TAURI_CLI_VERSION: "2.12.6"
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  supply-chain:
    name: advisories, licences, SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Rust toolchain (pinned)
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target x86_64-pc-windows-msvc
          rustup default "$RUST_TOOLCHAIN"

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cargo/bin/cargo-*
          key: supply-chain-tools-${{ env.RUST_TOOLCHAIN }}-audit${{ env.CARGO_AUDIT_VERSION }}-deny${{ env.CARGO_DENY_VERSION }}-cdx${{ env.CARGO_CYCLONEDX_VERSION }}

      - name: Install cargo-audit, cargo-deny, cargo-cyclonedx (pinned, --locked)
        run: |
          set -euo pipefail
          # Only the binaries are cached, so check versions by running them (cargo <sub> --version).
          want() { command -v "cargo-$1" >/dev/null && cargo "$1" --version | grep -qF "$2"; }
          get() { want "$1" "$2" || cargo install --locked --force "cargo-$1" --version "$2"; }
          get audit "$CARGO_AUDIT_VERSION"
          get deny "$CARGO_DENY_VERSION"
          get cyclonedx "$CARGO_CYCLONEDX_VERSION"
          cargo audit --version; cargo deny --version; cargo cyclonedx --version

      - name: cargo audit (RustSec advisories on desktop/Cargo.lock)
        run: cargo audit --file desktop/Cargo.lock --deny warnings

      - name: cargo deny (advisories, licences, bans, sources; Windows + Linux targets)
        run: cargo deny --manifest-path desktop/Cargo.toml --config desktop/ci/deny.toml check

      - name: SBOM (CycloneDX JSON, Windows target)
        run: |
          set -euo pipefail
          cargo cyclonedx --manifest-path desktop/Cargo.toml --format json --target x86_64-pc-windows-msvc
          mkdir -p "$RUNNER_TEMP/sbom"
          find desktop -name '*.cdx.json' -not -path '*/target/*' -exec cp {} "$RUNNER_TEMP/sbom/" \;
          ls -l "$RUNNER_TEMP/sbom"
          test -n "$(ls -A "$RUNNER_TEMP/sbom")"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom/
          retention-days: 1
          if-no-files-found: error

  windows:
    name: test, installer, smoke (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read   # find and download the previous run's installer for the upgrade test
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Metadata (version, GUI crate detection)
        id: meta
        run: |
          set -euo pipefail
          version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' desktop/Cargo.toml)
          base=${version%%-*}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version4=$base.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          conf=$(find desktop/crates -maxdepth 3 -name tauri.conf.json -not -path '*/target/*' | head -n1 || true)
          if [ -n "$conf" ]; then
            echo "gui_dir=$(dirname "$conf")" >> "$GITHUB_OUTPUT"
            echo "Tauri GUI crate found: $conf"
          else
            echo "No Tauri GUI crate yet: packaging ou-agent with desktop/ci/installer.nsi"
          fi
          echo "version $version"

      - name: Rust toolchain (pinned)
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target x86_64-pc-windows-msvc
          rustup default "$RUST_TOOLCHAIN"
          rustc -vV

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-tauri.exe
            desktop/target
          key: win-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: win-${{ env.RUST_TOOLCHAIN }}-

      - name: cargo test --workspace (Windows)
        working-directory: desktop
        run: cargo test --workspace --locked

      # ---- Tauri path (once the lead's GUI crate exists) ----
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.meta.outputs.gui_dir != ''
        with:
          node-version: "22"

      - name: Build with the Tauri bundler (NSIS per-user + MSI)
        if: steps.meta.outputs.gui_dir != ''
        working-directory: ${{ steps.meta.outputs.gui_dir }}
        run: |
          set -euo pipefail
          command -v cargo-tauri >/dev/null && cargo tauri --version | grep -q "$TAURI_CLI_VERSION" \
            || cargo install --locked --force tauri-cli --version "$TAURI_CLI_VERSION"
          grep -q '"installMode" *: *"currentUser"' tauri.conf.json \
            || echo "::warning::tauri.conf.json does not set bundle.windows.nsis.installMode=currentUser"
          cargo build --release --locked -p ou-agent --manifest-path "$GITHUB_WORKSPACE/desktop/Cargo.toml"
          cargo tauri build --bundles nsis,msi
          mkdir -p "$RUNNER_TEMP/out"
          cp "$GITHUB_WORKSPACE"/desktop/target/release/bundle/nsis/*.exe "$RUNNER_TEMP/out/"
          cp "$GITHUB_WORKSPACE"/desktop/target/release/bundle/msi/*.msi "$RUNNER_TEMP/out/" || echo "::warning::no MSI produced"

      # ---- Fallback path: ou-agent packaged by desktop/ci/installer.nsi ----
      - name: Build ou-agent (release) and the NSIS installer
        if: steps.meta.outputs.gui_dir == ''
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          VERSION4: ${{ steps.meta.outputs.version4 }}
          SHORT: ${{ steps.meta.outputs.short }}
        run: |
          set -euo pipefail
          cargo build --release --locked -p ou-agent --manifest-path desktop/Cargo.toml
          makensis="/c/Program Files (x86)/NSIS/makensis.exe"
          if [ ! -x "$makensis" ]; then
            choco install nsis --no-progress -y
          fi
          "$makensis" -VERSION
          stage="$RUNNER_TEMP/stage"; mkdir -p "$stage" "$RUNNER_TEMP/out"
          cp desktop/target/release/ou-agent.exe "$stage/"
          cp LICENSE "$stage/LICENSE"
          out="$RUNNER_TEMP/out/OfficeUnboundDesktop-${VERSION}-${SHORT}-x64-setup.exe"
          "$makensis" -V3 -WX \
            "-DVERSION=$VERSION" "-DVERSION4=$VERSION4" "-DBUILDID=$GITHUB_SHA" \
            "-DSRCDIR=$(cygpath -w "$stage")" "-DOUTFILE=$(cygpath -w "$out")" \
            desktop/ci/installer.nsi
          ls -l "$RUNNER_TEMP/out"

      - name: Previous installer artifact (for the upgrade test)
        id: prev
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow desktop-windows.yml --status success -L 20 \
                 --json databaseId --jq ".[] | select(.databaseId != $GITHUB_RUN_ID) | .databaseId" | head -n1)
          if [ -z "$id" ]; then echo "no previous successful run"; exit 0; fi
          gh run download "$id" -R "$GITHUB_REPOSITORY" --pattern 'ou-desktop-windows-*' -D "$RUNNER_TEMP/prev"
          f=$(find "$RUNNER_TEMP/prev" -name '*-setup.exe' | head -n1)
          echo "previous run $id: $f"
          echo "installer=$f" >> "$GITHUB_OUTPUT"
          echo "run_id=$id" >> "$GITHUB_OUTPUT"

      - name: Smoke test the installer on Windows
        shell: pwsh
        env:
          PREV: ${{ steps.prev.outputs.installer }}
        run: |
          $setup = Get-ChildItem "$env:RUNNER_TEMP\out\*-setup.exe" | Select-Object -First 1
          if (-not $setup) { $setup = Get-ChildItem "$env:RUNNER_TEMP\out\*.exe" | Select-Object -First 1 }
          $msi = Get-ChildItem "$env:RUNNER_TEMP\out\*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          $prev = if ($env:PREV) { $env:PREV } else { "" }
          $msiPath = if ($msi) { $msi.FullName } else { "" }
          & desktop/ci/smoke-windows.ps1 -Installer $setup.FullName -Previous $prev -Msi $msiPath -Report "$env:RUNNER_TEMP\out\smoke-report.md"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-build
          path: ${{ runner.temp }}/out/
          retention-days: 1
          if-no-files-found: error

  bundle:
    name: installer + sha256 + SBOM artifact
    needs: [supply-chain, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-build
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: dist/sbom
      - name: SHA256SUMS
        id: sums
        working-directory: dist
        run: |
          set -euo pipefail
          find . -type f ! -name SHA256SUMS -printf '%P\n' | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS
          {
            echo "## Unsigned alpha installer"
            echo '```'
            cat SHA256SUMS
            echo '```'
            echo "Download: \`gh run download $GITHUB_RUN_ID -R $GITHUB_REPOSITORY -n ou-desktop-windows-${{ needs.windows.outputs.version }}-${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ou-desktop-windows-${{ needs.windows.outputs.version }}-${{ steps.sums.outputs.short }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
