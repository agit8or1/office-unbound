name: desktop-windows

# Office Unbound Desktop on real Windows (GitHub-hosted windows-latest): tests, per-user NSIS installer
# (+ MSI once the Tauri GUI crate exists), installer smoke test, SBOM, advisories and licences.
# Output is an UNSIGNED ALPHA workflow artifact, never a release. No secrets, no signing.

on:
  push:
    branches: ["desktop-*"]
    # Engine-only changes have their own workflow (desktop-engine-windows.yml) and do not change the app.
    paths-ignore:
      - ".github/workflows/desktop-engine-windows.yml"
      - "desktop/ci/engine/**"
      - "docs/desktop/build-opencloudcmd.md"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.100.0"
  CARGO_AUDIT_VERSION: "0.22.2"
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_CYCLONEDX_VERSION: "0.5.10"
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  supply-chain:
    name: advisories, licences, SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Rust toolchain (pinned)
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target x86_64-pc-windows-msvc
          rustup default "$RUST_TOOLCHAIN"

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cargo/bin/cargo-*
          key: supply-chain-tools-${{ env.RUST_TOOLCHAIN }}-audit${{ env.CARGO_AUDIT_VERSION }}-deny${{ env.CARGO_DENY_VERSION }}-cdx${{ env.CARGO_CYCLONEDX_VERSION }}

      - name: Install cargo-audit, cargo-deny, cargo-cyclonedx (pinned, --locked)
        run: |
          set -euo pipefail
          # Only the binaries are cached, so check versions by running them (cargo <sub> --version).
          want() { command -v "cargo-$1" >/dev/null && cargo "$1" --version | grep -qF "$2"; }
          get() { want "$1" "$2" || cargo install --locked --force "cargo-$1" --version "$2"; }
          get audit "$CARGO_AUDIT_VERSION"
          get deny "$CARGO_DENY_VERSION"
          get cyclonedx "$CARGO_CYCLONEDX_VERSION"
          cargo audit --version; cargo deny --version; cargo cyclonedx --version

      # SBOM first, so the installer artifact gets one even when an advisory fails the gate below.
      - name: SBOM (CycloneDX JSON, Windows target)
        run: |
          set -euo pipefail
          cargo cyclonedx --manifest-path desktop/Cargo.toml --format json --target x86_64-pc-windows-msvc
          mkdir -p "$RUNNER_TEMP/sbom"
          find desktop -name '*.cdx.json' -not -path '*/target/*' -not -path '*/node_modules/*' -exec cp {} "$RUNNER_TEMP/sbom/" \;
          ls -l "$RUNNER_TEMP/sbom"
          test -n "$(ls -A "$RUNNER_TEMP/sbom")"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom/
          retention-days: 1
          if-no-files-found: error

      # cargo audit cannot filter by target, so it also reports Linux-only GUI crates (gtk/glib/zbus) that are not shipped.
      # Report only; the gate is cargo deny below, restricted to the Windows target.
      - name: cargo audit (RustSec, whole lock file, report only)
        run: cargo audit --file desktop/Cargo.lock || echo "::warning::cargo audit found advisories (whole lock incl. Linux-only crates); see cargo deny for the Windows gate"

      - name: cargo deny (advisories, licences, bans, sources; Windows target) - the gate
        run: cargo deny --manifest-path desktop/Cargo.toml --config desktop/ci/deny.toml check

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: (success() || failure()) && hashFiles('desktop/app/package-lock.json') != ''
        with:
          node-version: "22"

      - name: npm audit of the GUI frontend (fails on high or critical)
        if: (success() || failure()) && hashFiles('desktop/app/package-lock.json') != ''
        working-directory: desktop/app
        run: |
          npm audit --omit=dev || true
          npm audit --audit-level=high

  windows:
    name: test, installer, smoke (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 120   # a cold build of the chat stack (matrix-sdk, bundled SQLite) is slow; warm runs use the cache
    permissions:
      contents: read
      actions: read   # find and download the previous run's installer for the upgrade test
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tests: ${{ steps.tests.outcome }}
      smoke: ${{ steps.smoke.outcome }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Metadata (version, GUI crate detection)
        id: meta
        run: |
          set -euo pipefail
          version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' desktop/Cargo.toml)
          base=${version%%-*}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version4=$base.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          conf=$(find desktop -maxdepth 4 -name tauri.conf.json -not -path '*/target/*' -not -path '*/node_modules/*' | head -n1 || true)
          if [ -n "$conf" ]; then
            echo "gui_dir=$(dirname "$conf")" >> "$GITHUB_OUTPUT"
            echo "Tauri GUI crate found: $conf"
          else
            echo "No Tauri GUI crate yet: packaging ou-agent with desktop/ci/installer.nsi"
          fi
          echo "version $version"

      - name: Rust toolchain (pinned)
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target x86_64-pc-windows-msvc
          rustup default "$RUST_TOOLCHAIN"
          rustc -vV

      - name: Keep build-machine paths out of the binaries (--remap-path-prefix)
        run: |
          set -euo pipefail
          ch=$(cygpath -w "${CARGO_HOME:-$USERPROFILE/.cargo}")
          ws=$(cygpath -w "$GITHUB_WORKSPACE")
          echo "RUSTFLAGS=--remap-path-prefix=$ch=cargo --remap-path-prefix=$ws=src" >> "$GITHUB_ENV"
          echo "remapping $ch -> cargo, $ws -> src"

      # restore + explicit save (below, also on failure): a red test must not throw away a 40-minute chat-stack build.
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/target
          key: win-remap-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: win-remap-${{ env.RUST_TOOLCHAIN }}-

      # The GUI crate embeds the built frontend (frontendDist) at compile time, so build it before any cargo test.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.meta.outputs.gui_dir != ''
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json

      - name: Frontend (npm ci from the lock file, typecheck, unit tests, build)
        if: steps.meta.outputs.gui_dir != ''
        working-directory: ${{ steps.meta.outputs.gui_dir }}/..
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          if npm run | grep -q '^  typecheck'; then npm run typecheck; fi
          if npm run | grep -q '^  test'; then npm test; fi
          npm run build

      # tauri-build checks that every externalBin exists, so the agent sidecar must be staged before cargo test.
      - name: Stage the ou-agent sidecar (release build)
        id: stage
        if: steps.meta.outputs.gui_dir != ''
        env:
          GUI_DIR: ${{ steps.meta.outputs.gui_dir }}
        run: |
          set -euo pipefail
          cargo build --release --locked -p ou-agent --manifest-path desktop/Cargo.toml
          mkdir -p "$GUI_DIR/binaries"
          cp desktop/target/release/ou-agent.exe "$GUI_DIR/binaries/ou-agent-x86_64-pc-windows-msvc.exe"

      - name: cargo test --workspace (Windows; offline tests only, never live tests)
        id: tests
        working-directory: desktop
        run: |
          set -euo pipefail
          # Live tests (tests/live_*.rs) need real credentials, which never go into CI. For crates that have them, run the
          # lib tests and every other test target; all remaining crates run in full.
          unset OU_FILES_LIVE_URL OU_FILES_TOKEN_CMD OU_FILES_ENGINE OU_CHAT_LIVE
          live=""
          for d in crates/*/; do ls "$d"tests/live_*.rs >/dev/null 2>&1 && live="$live $(basename "$d")"; done
          excl=""; for c in $live; do excl="$excl --exclude $c"; done
          echo "crates with live tests (offline targets only):$live"
          # shellcheck disable=SC2086
          cargo test --workspace --locked $excl
          for c in $live; do
            args="--lib"
            for t in crates/"$c"/tests/*.rs; do
              n=$(basename "$t" .rs)
              case "$n" in live_*) ;; *) args="$args --test $n" ;; esac
            done
            echo "== $c: cargo test $args"
            # shellcheck disable=SC2086
            cargo test -p "$c" --locked $args
          done

      - name: ou-files Windows probe (real NTFS junctions, symlinks, name rules, drive letters)
        if: (success() || (failure() && steps.tests.outcome == 'failure')) && hashFiles('desktop/crates/ou-files/Cargo.toml') != ''
        working-directory: desktop/ci/winprobe
        run: |
          set -euo pipefail
          # Seed the lock from the one ou-files is tested with, so the probe resolves the same versions.
          if [ -f ../../crates/ou-files/Cargo.lock ]; then cp ../../crates/ou-files/Cargo.lock Cargo.lock; else cp ../../Cargo.lock Cargo.lock; fi
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/desktop/target" cargo test --test windows -- --nocapture --test-threads 1

      # ---- Tauri path (GUI crate present): the app's own @tauri-apps/cli from package-lock.json ----
      # When only the test step failed, the installer is still built and smoke-tested so a red run carries full evidence;
      # the job (and the run) stays red, and GATE.txt in the artifact records it.
      - name: Build the GUI + agent sidecar and the NSIS installer (per-user)
        id: installer
        if: (success() || (failure() && steps.tests.outcome == 'failure')) && steps.meta.outputs.gui_dir != ''
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SHORT: ${{ steps.meta.outputs.short }}
          GUI_DIR: ${{ steps.meta.outputs.gui_dir }}
        run: |
          set -euo pipefail
          grep -q '"installMode" *: *"currentUser"' "$GUI_DIR/tauri.conf.json" \
            || echo "::warning::tauri.conf.json does not set bundle.windows.nsis.installMode=currentUser"
          mkdir -p "$RUNNER_TEMP/out"
          # The cached target dir holds earlier bundles: clear them, then take exactly this version's installer.
          rm -rf desktop/target/release/bundle
          (cd "$GUI_DIR/.." && npx --no-install tauri build --bundles nsis -- --locked)
          ls -l desktop/target/release/bundle/nsis/
          setup="desktop/target/release/bundle/nsis/Office Unbound_${VERSION}_x64-setup.exe"
          test -f "$setup" || { echo "::error::no installer for version $VERSION"; exit 1; }
          cp "$setup" "$RUNNER_TEMP/out/OfficeUnbound-${VERSION}-${SHORT}-x64-setup.exe"

      - name: MSI (WiX; best effort, the Tauri MSI is per-machine)
        if: (success() || (failure() && steps.tests.outcome == 'failure')) && steps.installer.outcome == 'success'
        continue-on-error: true
        env:
          VERSION4: ${{ steps.meta.outputs.version4 }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHORT: ${{ steps.meta.outputs.short }}
          GUI_DIR: ${{ steps.meta.outputs.gui_dir }}
        run: |
          set -euo pipefail
          # WiX rejects "-alpha.1"; override only the MSI version (tauri.conf.json unchanged), e.g. 0.1.0.<run number>.
          (cd "$GUI_DIR/.." && npx --no-install tauri build --bundles msi \
             --config "{\"bundle\":{\"windows\":{\"wix\":{\"version\":\"$VERSION4\"}}}}" -- --locked)
          msi="desktop/target/release/bundle/msi/Office Unbound_${VERSION}_x64_en-US.msi"
          test -f "$msi" || msi=$(ls -1t desktop/target/release/bundle/msi/*.msi | head -n1)
          cp "$msi" "$RUNNER_TEMP/out/OfficeUnbound-${VERSION}-${SHORT}-x64.msi"

      # ---- Fallback path: ou-agent packaged by desktop/ci/installer.nsi ----
      - name: Build ou-agent (release) and the NSIS installer
        if: steps.meta.outputs.gui_dir == ''
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          VERSION4: ${{ steps.meta.outputs.version4 }}
          SHORT: ${{ steps.meta.outputs.short }}
        run: |
          set -euo pipefail
          cargo build --release --locked -p ou-agent --manifest-path desktop/Cargo.toml
          makensis="/c/Program Files (x86)/NSIS/makensis.exe"
          if [ ! -x "$makensis" ]; then
            choco install nsis --no-progress -y
          fi
          "$makensis" -VERSION
          stage="$RUNNER_TEMP/stage"; mkdir -p "$stage" "$RUNNER_TEMP/out"
          cp desktop/target/release/ou-agent.exe "$stage/"
          cp LICENSE "$stage/LICENSE"
          out="$RUNNER_TEMP/out/OfficeUnboundDesktop-${VERSION}-${SHORT}-x64-setup.exe"
          "$makensis" -V3 -WX \
            "-DVERSION=$VERSION" "-DVERSION4=$VERSION4" "-DBUILDID=$GITHUB_SHA" \
            "-DSRCDIR=$(cygpath -w "$stage")" "-DOUTFILE=$(cygpath -w "$out")" \
            desktop/ci/installer.nsi
          ls -l "$RUNNER_TEMP/out"

      - name: Previous installer artifact of the same kind (for the upgrade test)
        id: prev
        if: (success() || (failure() && steps.tests.outcome == 'failure'))
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          # Tauri installers are named OfficeUnbound-*, the ou-agent-only fallback ones OfficeUnboundDesktop-*.
          KIND: ${{ steps.meta.outputs.gui_dir != '' && 'OfficeUnbound-' || 'OfficeUnboundDesktop-' }}
        run: |
          set -euo pipefail
          ids=$(gh run list -R "$GITHUB_REPOSITORY" --workflow desktop-windows.yml --status completed -L 20 \
                  --json databaseId --jq ".[] | select(.databaseId != $GITHUB_RUN_ID) | .databaseId" | head -n 6)
          for id in $ids; do
            d="$RUNNER_TEMP/prev/$id"
            gh run download "$id" -R "$GITHUB_REPOSITORY" --pattern 'ou-desktop-windows-*' -D "$d" || continue
            f=$(find "$d" -name "${KIND}*-setup.exe" | head -n1)
            if [ -n "$f" ]; then
              echo "previous run $id: $f"
              echo "installer=$f" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "no previous run with a ${KIND}* installer"

      - name: Smoke test the installer on Windows
        id: smoke
        if: (success() || (failure() && steps.tests.outcome == 'failure')) && (steps.installer.outcome == 'success' || steps.meta.outputs.gui_dir == '')
        shell: pwsh
        env:
          PREV: ${{ steps.prev.outputs.installer }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $setup = Get-ChildItem "$env:RUNNER_TEMP\out\*-setup.exe" | Select-Object -First 1
          if (-not $setup) { $setup = Get-ChildItem "$env:RUNNER_TEMP\out\*.exe" | Select-Object -First 1 }
          $msi = Get-ChildItem "$env:RUNNER_TEMP\out\*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          $prev = if ($env:PREV) { $env:PREV } else { "" }
          $msiPath = if ($msi) { $msi.FullName } else { "" }
          & desktop/ci/smoke-windows.ps1 -Installer $setup.FullName -Previous $prev -Msi $msiPath -Report "$env:RUNNER_TEMP\out\smoke-report.md" -ExpectVersion $env:VERSION
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: (success() || (failure() && steps.tests.outcome == 'failure')) && steps.smoke.outcome == 'success'
        with:
          name: windows-build
          path: ${{ runner.temp }}/out/
          retention-days: 1
          if-no-files-found: error

      - uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        if: always() && steps.stage.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/target
          key: win-remap-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('desktop/Cargo.lock') }}

  bundle:
    name: installer + sha256 + SBOM artifact
    needs: [supply-chain, windows]
    # Still bundle when only the advisory/licence gate failed: the run stays red, the artifact says so.
    if: always() && needs.windows.outputs.smoke == 'success' && needs.supply-chain.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-build
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: dist/sbom
      - name: SHA256SUMS
        id: sums
        working-directory: dist
        run: |
          set -euo pipefail
          {
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (commit $GITHUB_SHA)"
            echo "supply-chain gate: ${{ needs.supply-chain.result }}"
            echo "windows tests: ${{ needs.windows.outputs.tests }}"
            echo "installer smoke test: ${{ needs.windows.outputs.smoke }}"
            echo "windows job: ${{ needs.windows.result }}"
          } > GATE.txt
          cat GATE.txt
          find . -type f ! -name SHA256SUMS -printf '%P\n' | sort | xargs -d '\n' sha256sum > SHA256SUMS
          cat SHA256SUMS
          {
            echo "## Unsigned alpha installer"
            echo "Supply-chain gate: **${{ needs.supply-chain.result }}**, Windows tests: **${{ needs.windows.outputs.tests }}**, smoke: **${{ needs.windows.outputs.smoke }}**"
            echo '```'
            cat SHA256SUMS
            echo '```'
            echo "Download: \`gh run download $GITHUB_RUN_ID -R $GITHUB_REPOSITORY -n ou-desktop-windows-${{ needs.windows.outputs.version }}-${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ou-desktop-windows-${{ needs.windows.outputs.version }}-${{ steps.sums.outputs.short }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
