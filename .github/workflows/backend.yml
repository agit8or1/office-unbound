name: backend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          # CI-only throwaway container on the runner's loopback: no password exists, nothing real is protected.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ics/requirements.lock

      - name: Install dependencies (hash-checked lock file)
        working-directory: ics
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --no-deps -r requirements.lock

      - name: Create CI-only roles, databases and test env file (random passwords, never leave the job)
        run: |
          set -euo pipefail
          rand() { python -c 'import secrets; print(secrets.token_hex(24))'; }
          T_OWNER_PW=$(rand); T_APP_PW=$(rand); M_OWNER_PW=$(rand); M_APP_PW=$(rand)
          echo "::add-mask::$T_OWNER_PW"; echo "::add-mask::$T_APP_PW"; echo "::add-mask::$M_OWNER_PW"; echo "::add-mask::$M_APP_PW"
          psql_su() { PGPASSWORD="" psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 "$@"; }
          # the tests' roles/database (tests/conftest.py refuses any database that is not ics_test[_slot])
          psql_su -c "CREATE ROLE ics_test_owner LOGIN PASSWORD '$T_OWNER_PW'"
          psql_su -c "CREATE ROLE ics_test_app LOGIN PASSWORD '$T_APP_PW'"
          psql_su -c "CREATE DATABASE ics_test OWNER ics_test_owner"
          psql_su -c "GRANT CONNECT ON DATABASE ics_test TO ics_test_app"
          # the production-shaped roles used for the plain `alembic upgrade` check
          psql_su -c "CREATE ROLE ics_owner LOGIN PASSWORD '$M_OWNER_PW'"
          psql_su -c "CREATE ROLE ics_app LOGIN PASSWORD '$M_APP_PW'"
          psql_su -c "CREATE DATABASE ics_migrate_check OWNER ics_owner"
          psql_su -c "GRANT CONNECT ON DATABASE ics_migrate_check TO ics_app"
          umask 077
          {
            echo "ICS_TEST_DATABASE_URL=postgresql+psycopg://ics_test_app:${T_APP_PW}@127.0.0.1:5432/ics_test"
            echo "ICS_TEST_OWNER_DATABASE_URL=postgresql+psycopg://ics_test_owner:${T_OWNER_PW}@127.0.0.1:5432/ics_test"
          } > "$RUNNER_TEMP/ics-test-ci.env"
          echo "ICS_TEST_ENV_FILE=$RUNNER_TEMP/ics-test-ci.env" >> "$GITHUB_ENV"
          echo "ICS_MIGRATE_DATABASE_URL=postgresql+psycopg://ics_owner:${M_OWNER_PW}@127.0.0.1:5432/ics_migrate_check" >> "$GITHUB_ENV"

      - name: Alembic upgrade head on an empty database (owner role, production grants)
        working-directory: ics
        run: |
          python -m ics.migrate
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          e = create_engine(os.environ["ICS_MIGRATE_DATABASE_URL"])
          with e.connect() as c:
              print("alembic version:", c.execute(text("select version_num from alembic_version")).scalar())
          PY

      - name: pytest
        working-directory: ics
        run: python -m pytest -q
