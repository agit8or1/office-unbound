name: roadmap
on:
  push:
    paths: ["docs/progress.json", "ROADMAP.md", "scripts/render_roadmap.py", "scripts/release_notes.py", "CHANGELOG.md", "VERSION", ".github/workflows/roadmap.yml"]
  pull_request:
    paths: ["docs/progress.json", "ROADMAP.md", "scripts/render_roadmap.py"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Validate progress feed and check ROADMAP.md is current
        run: python3 scripts/render_roadmap.py --check
      - name: Check changelog is consistent with VERSION and the progress feed
        run: python3 scripts/release_notes.py --check
